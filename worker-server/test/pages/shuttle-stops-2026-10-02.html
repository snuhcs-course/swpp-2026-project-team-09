    <script lang="ja">
        const busMap = new Map();

        function busmove(id, x, y) { 
            var oldx = 0;
            var oldy = 0;

            // 버스맵에 없으면 넣기
            if (!busMap.has(id)) {
                oldx = 0;
                oldy = 0;
            }
            // 버스맵에 있으면 위치가져오기
            else {
                var xy = busMap.get(id);
                oldx = xy.split(',')[0];
                oldy = xy.split(',')[1];
            }


            // 버스맵에 있으면 가져오고, 넣기
            const element = document.getElementById(id);
             
            
            element.animate(
                {
                    transform: [
                        'translate(' + oldx + 'px,' + oldy + 'px)',  // 시작 값
                        'translate(' + x + 'px,' + y + 'px)'  // 종료 값
                    ]
                },
                {
                    duration: 3000,  // 밀리초 지정
                    fill: 'forwards',  // 종료 시 속성을 지님
                    easing: 'ease'  // 가속도 종류
                }
            );

            // 버스맵에 넣기
            busMap.set(id, x + ',' + y);
        }
         
    </script>
