    category: life
    title: 분실물센터 위치 알아두기
    brief: 물건을 잃어버리면 찾아갈 교내 분실물센터를 알아 두세요.
    body:
      - 교내 분실물센터는 아시아연구소(101동) 1층, 국민은행 옆에 있어요. 캠퍼스안전반이 운영해요.
