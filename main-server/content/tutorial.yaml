  - key: kwanjeong
    order: 5
    category: study
    icon: book
    title: 관정도서관 예약하기
    brief: 관정도서관 열람실을 예약하고 이용해 보세요.
    body:
      - 관정도서관은 관정도서관 내부 키오스크에 로그인한 후 좌석을 예약하거나, 관정도서관 공식 앱, 또는 이 SNU Now에서 어시스턴트에게 부탁해 예약을 진행할 수 있어요. 이번 튜토리얼에서는 관정도서관을 이용해보세요!
      - 열람실 좌석은 예약한 뒤 30분 안에 좌석배정기(키오스크)에서 확인해야 해요. 확인하지 않으면 자동으로 반납돼요.
      - 확인하지 않거나 반납하지 않은 일이 한 달에 5번이면 10일 동안 예약할 수 없어요. 그룹스터디룸은 1시간 안에 들어가지 않으면 취소되고, 7일에 3번이면 3일 동안 예약할 수 없어요.
      - 사용 다했으면 꼭 반납처리를 해주세요! 저한테 말해주셔도 되고 키오스크를 이용해 반납하셔도 돼요!
    condition: 관정도서관 열람실이나 스터디룸 예약 및 이용
    completion:
      kind: kwanjeongCheck
      skipLabel: 이미 예약 및 이용해본 적이 있어요
    # The words of 어시스턴트에게 예약 부탁하기, which the sheet shows while 관정 booking is on (LIBRARY_BOOKING_ENABLED).
    ask: 관정도서관 7층 열람실에 한 자리 예약해줘
    completionMessage: 관정도서관 이용은 어떠셨나요? 도서관을 자주 이용해 보아요!
    places:
      - place: '62-1'
    links: []
    # The boards MainTutKw1–3. The buttons that ask the Assistant are left out while 관정 booking is off.
    guide:
      steps:
        - tab: 예약
          title: 좌석 예약
          place: { place: '62-1' }
          name: 관정도서관
          sub: 62-1동
          chips:
            - { icon: monitor, words: 키오스크 }
            - { icon: phone, words: 관정 앱 }
            - { icon: spark, words: SNU Now 어시스턴트 }
          actions:
            - { kind: ask, words: 어시스턴트에게 부탁, ask: 관정도서관 7층 열람실에 한 자리 예약해줘 }
            - { kind: route, words: 길찾기 }
        - tab: 확인
          title: 30분 안에 확인
          place: { place: '62-1' }
          name: 좌석배정기
          sub: 관정도서관 키오스크
          chips:
            - { icon: clock, words: 예약 후 30분 안 }
            - { icon: info, words: 안 하면 자동 반납 }
        - tab: 반납
          title: 다 쓰면 반납
          place: { place: '62-1' }
          name: 키오스크 · 어시스턴트
          sub: 둘 중 편한 곳에서
          chips:
            - { icon: info, words: 한 달 5번 놓치면 10일 정지 }
          actions:
            - { kind: ask, words: 어시스턴트에게 반납, ask: 관정도서관 좌석 반납해줘 }

