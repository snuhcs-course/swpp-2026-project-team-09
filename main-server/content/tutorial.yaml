  # *drafted* (P13): brief, body, condition and completionMessage, for the PM's review. Re-read on 2026-11-04: the
  # course is 서울등산관광센터's 연주대 A코스 (서울대건설환경종합연구소 → 도림천계곡 → 연주대 정상), "the shortest and
  # easiest to 연주대"; the press's "공학관 입구" is the same start. Its time is left out of body and facts: the guide's
  # table does not tie a time to the course plainly, and the press gives a reporter's 70 minutes and "보통 85분".
  # The two points are OpenStreetMap's: the bus stop 건설환경종합연구소 (node 11560054588), next to the trailhead by
  # the guide, and 연주대 (node 3445797247).
  - key: gwanaksan-engineering-trail
    order: 15
    category: culture
    title: 공학관 코스로 관악산 오르기
    brief: 캠퍼스에서 바로 관악산 정상 연주대까지 올라 보세요.
    body:
      - 공대 위 건설환경종합연구소에서 도림천계곡을 따라 관악산 정상 연주대까지 오를 수 있어요. 서울등산관광센터는 이 길(연주대 A코스)을 연주대에 오르는 가장 짧고 쉬운 코스로 안내해요.
      - · 등산로 입구는 5513번 버스의 건설환경종합연구소 정류장 바로 옆이에요.
      - · 산길이니 편한 신발을 신고, 해가 지기 전에 내려오세요.
    condition: 연주대까지 올라 보기
    completion:
      kind: button
    completionMessage: 정상에서 본 캠퍼스는 어땠나요? 수고 많았어요!
    places:
      - point:
          latitude: 37.4472146
          longitude: 126.9498331
        label: 등산로 입구 (건설환경종합연구소 정류장)
      - point:
          latitude: 37.4447713
          longitude: 126.9645611
        label: 연주대 (관악산 정상)
    links:
      - label: 관악산 등산 코스 (서울등산관광센터)
        url: https://seoulhiking.or.kr/theme/basic/img/mountain_gwanaksan-kr.pdf
    # Left out (above): how long the climb takes.
    facts:
      - text: 서울등산관광센터는 서울대건설환경종합연구소 → 도림천계곡 → 연주대 정상의 연주대 A코스를 관악산 정상 연주대에 오르는 가장 짧고 쉬운 코스로, 등산 초보자도 도전해 볼 만하다고 안내해요.
        source: https://seoulhiking.or.kr/theme/basic/img/mountain_gwanaksan-kr.pdf
        checked: 2026-11-04
      - text: 2호선 서울대입구역 3번 출구로 나와 200m쯤 걸어 5513번 버스를 타고 건설환경종합연구소 정류장에서 내리면 바로 옆이 등산로 입구예요.
        source: https://seoulhiking.or.kr/theme/basic/img/mountain_gwanaksan-kr.pdf
        checked: 2026-11-04
      - text: 2026년 3월 기사에 따르면 주말과 공휴일에는 연주대 정상에서 사진을 찍으려고 1시간가량 줄을 서기도 해요.
        source: https://www.hankyung.com/article/2026030487117
        checked: 2026-11-04
