  # *drafted* (P13): brief, body, condition and completionMessage, for the PM's review. The night lines only; the
  # daytime 행정관 셔틀 is admin-shuttle's.
  - key: night-shuttle
    order: 10
    category: transit
    title: 야간 셔틀 타기
    brief: 밤늦게까지 공부한 날에도 셔틀을 타고 집에 갈 수 있어요.
    body:
      - 밤에는 셔틀이 두 가지 있어요.
      - '· 야간 도서관 셔틀(탈출셔틀): 연중 21:10, 21:40, 22:10, 22:40, 23:10에 행정관 앞에서 서울대입구역과 대학동으로 바로 가요.'
      - '· 심야셔틀: 학기 중 24:00–02:00에 30분 간격으로 에너지자원신기술연구소에서 출발해 교내를 돌고 낙성대(인헌초)를 거쳐 서울대입구역 3번 출구까지 가요.'
      - '· 2026년 시험기간(10/12–10/30, 11/30–12/14, 주말·공휴일 제외)에는 심야셔틀이 302동에서 23:40, 00:15, 00:50, 01:25, 02:00에 출발하고, 서울대입구역행 도서관 셔틀이 2대에서 3대로 늘어요.'
    condition: 야간 도서관 셔틀이나 심야셔틀 타 보기
    completion:
      kind: button
    completionMessage: 늦은 밤에도 안전하게 돌아가셨나요? 오늘도 수고 많았어요!
    places:
      # The 행정관 셔틀 정류장 of admin-shuttle; the shuttle page says 행정관 앞.
      - point:
          latitude: 37.460938
          longitude: 126.950312
        label: 행정관 앞 (야간 도서관 셔틀)
      - place: '302'
        label: 제2공학관(302동) (시험기간 심야셔틀)
    links:
      - label: 셔틀버스 노선 및 시간
        url: https://www.snu.ac.kr/about/gwanak/shuttles/shuttle_stops
      - label: 시험기간 셔틀 증차 및 심야셔틀 노선 변경 안내 (컴퓨터공학부 공지)
        url: https://cse.snu.ac.kr/ko/community/notice/25702
    # Left out, as the page says only 학기중: whether the 심야셔틀 runs in the vacation.
    facts:
      - text: 야간 도서관 셔틀은 연중 21:10, 21:40, 22:10, 22:40, 23:10에 행정관 앞에서 출발해요. 서울대입구역으로 바로 가는 차와 대학동(서울정보학교 인근 세븐일레븐 앞)으로 바로 가는 차가 있어요.
        source: https://www.snu.ac.kr/about/gwanak/shuttles/shuttle_stops
        checked: 2026-11-04
      - text: 심야셔틀은 학기 중 24:00–02:00에 30분 간격으로 다니는 25인승이에요. 에너지자원신기술연구소 → 301동 → 302동 → 38동 → 농생대 → 자연대 → 정문 → 경영대 → 수의대 → 국제대학원 → 기숙사 → BK국제관 → 낙성대(인헌초) → 서울대입구역(3번 출구)으로 가요.
        source: https://www.snu.ac.kr/about/gwanak/shuttles/shuttle_stops
        checked: 2026-11-04
      - text: 2026년 시험기간(1차 10/12–10/30, 2차 11/30–12/14, 주말·공휴일 제외)에는 심야셔틀 1대가 302동에서 23:40, 00:15, 00:50, 01:25, 02:00에 35분 간격으로 출발해요. 302동 → 301동 → 에너지자원신기술연구소 → 38동 → 농생대 → 자연대 → 정문 → 경영대 → 수의대 → 국제대학원 → 노천강당 → 기숙사 → BK국제관 → 낙성대(인헌초) → 서울대입구역으로 가요.
        source: https://cse.snu.ac.kr/ko/community/notice/25702
        checked: 2026-11-04
      - text: 2026년 시험기간에는 야간 도서관 셔틀의 행정관 → 서울대입구역 노선이 2대에서 3대로 늘어요. 행정관 → 대학동은 2대 그대로이고, 출발 시간은 같아요.
        source: https://cse.snu.ac.kr/ko/community/notice/25702
        checked: 2026-11-04

  - key: health-clinic
    order: 11
    category: health
    title: 서울대 보건진료소 이용
    brief: 보건진료소가 어디 있는지 알아 두세요.
