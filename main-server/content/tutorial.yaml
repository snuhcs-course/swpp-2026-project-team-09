        checked: 2026-11-04
      - text: 학생회관(63동)과 풍산마당 2층 연습실은 총동아리연합회 단체ID를 받은 학생단체(동아리)만 쓸 수 있어요.
        source: https://student.snu.ac.kr/%eb%8c%80%ed%95%99%ec%83%9d%ed%99%9c/%eb%ac%b8%ed%99%94%c2%b7%ec%98%88%ec%88%a0/%ec%97%b0%ec%8a%b5%ec%8b%a4/
