  - key: laptop-rental
    order: 4
    category: life
    title: 노트북 대여 서비스 알아두기
    brief: 노트북이 고장 나도 걱정 마세요. 정보화본부에서 하루 1,000원에 빌릴 수 있어요.
    body:
      - 정보화본부(102동) 101호 IT Service Center에서 학생은 노트북을 하루 1,000원에 빌릴 수 있어요.
      - '· 신청: 마이스누 → 캠퍼스·복지 → IT서비스 → 장비/SW대여 → 장비신청'
      - · 대여와 반납은 평일 09:00–18:00에만 돼요. 주말과 공휴일에는 안 돼요.
      - · 늦게 반납하면 하루에 대여료의 2배를 연체료로 내요.
    condition: 노트북 대여 방법 확인하기
    completion:
      kind: button
    completionMessage: 급할 때 노트북을 빌릴 곳이 생겼어요!
    places:
      - place: '102'
        label: 정보화본부(102동) 101호
    links:
      - label: 정보화본부 전산장비 대여
        url: https://ist.snu.ac.kr/%ec%a0%84%ec%82%b0%ec%9e%a5%eb%b9%84%eb%8c%80%ec%97%ac/
    # Left out, as the page does not state it: the longest a laptop may be borrowed.
    facts:
      - text: 학생 개인용 노트북은 하루 1,000원이에요. 마이스누 → 캠퍼스·복지 → IT서비스 → 장비/SW대여 → 장비신청에서 신청해요.
        source: https://ist.snu.ac.kr/%ec%a0%84%ec%82%b0%ec%9e%a5%eb%b9%84%eb%8c%80%ec%97%ac/
        checked: 2026-11-04
      - text: 관악캠퍼스에서는 정보화본부(102동 101호) IT Service Center에서 빌리고 돌려줘요.
        source: https://ist.snu.ac.kr/%ec%a0%84%ec%82%b0%ec%9e%a5%eb%b9%84%eb%8c%80%ec%97%ac/
        checked: 2026-11-04
      - text: 운영 시간은 평일 09:00–18:00이고, 주말과 공휴일에는 대여와 반납을 할 수 없어요. 연체료는 하루에 대여료의 2배예요.
        source: https://ist.snu.ac.kr/%ec%a0%84%ec%82%b0%ec%9e%a5%eb%b9%84%eb%8c%80%ec%97%ac/
        checked: 2026-11-04
      - text: 기종은 삼성 NT750XGK(15.6인치), LG그램 15ZG90R(15인치), LG그램 14Z90S(14인치)이고, Windows 11에 한글과 MS Office 등이 깔려 있어요.
        source: https://ist.snu.ac.kr/%ec%a0%84%ec%82%b0%ec%9e%a5%eb%b9%84%eb%8c%80%ec%97%ac/
        checked: 2026-11-04

  - key: kwanjeong
    order: 5
    category: study
    title: 관정도서관 예약하기
    brief: 관정도서관 열람실을 예약하고 이용해 보세요.
    body:
      - 관정도서관은 관정도서관 내부 키오스크에 로그인한 후 좌석을 예약하거나, 관정도서관 공식 앱, 또는 이 SNU Now에서 어시스턴트에게 부탁해 예약을 진행할 수 있어요. 이번 튜토리얼에서는 관정도서관을 이용해보세요!
      - 열람실 좌석은 예약한 뒤 30분 안에 좌석배정기(키오스크)에서 확인해야 해요. 확인하지 않으면 자동으로 반납돼요.
      - 확인하지 않거나 반납하지 않은 일이 한 달에 5번이면 10일 동안 예약할 수 없어요. 그룹스터디룸은 1시간 안에 들어가지 않으면 취소되고, 7일에 3번이면 3일 동안 예약할 수 없어요.
      - 사용 다했으면 꼭 반납처리를 해주세요! 저한테 말해주셔도 되고 키오스크를 이용해 반납하셔도 돼요!
    condition: 관정도서관 열람실이나 스터디룸 예약 및 이용
    completion:
      kind: kwanjeongCheck
      skipLabel: 이미 예약 및 이용해본 적이 있어요
    # The words of 어시스턴트에게 예약 부탁하기, which the sheet shows while 관정 booking is on (LIBRARY_BOOKING_ENABLED).
    ask: 관정도서관 7층 열람실에 한 자리 예약해줘
    completionMessage: 관정도서관 이용은 어떠셨나요? 도서관을 자주 이용해 보아요!
    places:
      - place: '62-1'
    links: []

