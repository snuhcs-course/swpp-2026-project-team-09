# The 새내기 튜토리얼 (README.md: Tutorial). The server checks this file when it starts and serves it with GET /tutorial,
# so the app keeps no copy. Each entry is one Tutorial Quest, shown in `order`. Adding a quest is an entry here.
#
# Each quest names its Tutorial Category (`category`), one of `categories`, which lists them in the order the app shows
# them. A category's quests come one after another in `order`. A User's progress is kept by `key`, so a new `order`
# keeps it.
#
# A place is a Place of the shared seed by its number (seed/campus-map-places.json and the others), with the floor and
# the label shown when they help, or a point with its label. A completion is `button` (완료했어요), or `kwanjeongCheck`,
# which the phone checks against the User's library bookings, with the label of its skip; the server serves it as
# `button` unless LIBRARY_BOOKING_ENABLED and TUTORIAL_KWANJEONG_CHECK are both on. `ask` is what 어시스턴트에게 예약
# 부탁하기 sends.
# `facts` are what the Assistant answers from beyond the sheet's text (getTutorial), each with its source and the day
# it was checked; GET /tutorial does not serve them. A fact the source does not state is left out, and the Assistant
# answers it as 확인되지 않아요 with the quest's link.
#
# The texts marked *drafted* in the P06 spec (the briefs, conditions and completion messages of the quests other than
# kwanjeong) wait for the owner's review before the P6 eval set freezes them. The ten quests P13 added are marked
# *drafted* each, from .scratch/iteration-3/P13-freshman-and-kwanjeong-improve/references/quest-candidates.md, with
# their facts read again on the official pages on 2026-11-04.

