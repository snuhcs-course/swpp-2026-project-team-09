      - · 1개월 동안 보관한 뒤에는 경찰청 유실물센터와 관악경찰서로 넘어가요.
    condition: 분실물센터 위치 확인하기
    completion:
      kind: button
    completionMessage: 이제 물건을 잃어버려도 어디로 가야 할지 알겠죠?
