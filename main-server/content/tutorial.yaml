  - key: ms365-campus-software
    order: 8
    category: study
    title: 캠퍼스 라이선스 소프트웨어 받기
    brief: 한글, MS Office, SPSS, MATLAB 같은 소프트웨어를 학교 라이선스로 받을 수 있어요.
    body:
      - 서울대 구성원은 교육·연구에 쓰는 소프트웨어를 학교 라이선스로 무료로 쓸 수 있어요. Windows, 한글, MS Office, V3, 알툴즈, SPSS·SAS·Stata, MATLAB, ChemDraw 등이 있어요.
      - '· 받는 곳: 학내에서 마이스누에 로그인한 뒤 캠퍼스·복지 → IT서비스 → 장비/SW대여 → 캠퍼스라이선스SW다운로드'
      - · 순수 교육과 연구 목적으로만 쓸 수 있어요.
      - · Microsoft 365는 mso365.snu.ac.kr에서 SNU 아이디로 써요. 졸업하면 쓸 수 없어요.
    condition: 캠퍼스 라이선스 소프트웨어 받는 곳 확인하기
    completion:
      kind: button
    completionMessage: 이제 필요한 프로그램을 사지 않고 학교 라이선스로 써 보세요!
    places: []
    links:
      - label: 정보화본부 캠퍼스 라이선스 소프트웨어
        url: https://ist.snu.ac.kr/%ec%ba%a0%ed%8d%bc%ec%8a%a4-%eb%9d%bc%ec%9d%b4%ec%84%a0%ec%8a%a4-%ec%86%8c%ed%94%84%ed%8a%b8%ec%9b%a8%ec%96%b4/
      - label: Microsoft 365
        url: https://mso365.snu.ac.kr/
    # Left out: whether the licences may be installed on a student's own laptop (the sources disagree, above).
    facts:
      - text: 캠퍼스 라이선스 소프트웨어는 MS Windows(업그레이드용)와 Office, 한글, SAS, Stata, SPSS Statistics, MATLAB, ChemDraw, AutoDesk(교육용), V3, 알툴즈 등이에요. 재학생과 교직원이 대상이에요.
        source: https://ist.snu.ac.kr/%ec%ba%a0%ed%8d%bc%ec%8a%a4-%eb%9d%bc%ec%9d%b4%ec%84%a0%ec%8a%a4-%ec%86%8c%ed%94%84%ed%8a%b8%ec%9b%a8%ec%96%b4/
        checked: 2026-11-04
      - text: 학내에서 마이스누에 로그인한 뒤 내려받아요.
        source: https://www.snu.ac.kr/campuslife/aid/it
        checked: 2026-11-04
      - text: 메뉴는 마이스누 로그인 → 캠퍼스·복지 → IT서비스 → 장비/SW대여 → 캠퍼스라이선스SW다운로드, 또는 메인페이지의 소프트웨어 다운로드예요.
        source: https://ist.snu.ac.kr/%ec%ba%a0%ed%8d%bc%ec%8a%a4-%eb%9d%bc%ec%9d%b4%ec%84%a0%ec%8a%a4-%ec%86%8c%ed%94%84%ed%8a%b8%ec%9b%a8%ec%96%b4/
        checked: 2026-11-04
      - text: 순수 교육·연구 목적 외에는 쓸 수 없고, 학내 벤처기업 같은 영리 단체와 병원·병원 부속시설에서는 쓸 수 없어요.
        source: https://ist.snu.ac.kr/%ec%ba%a0%ed%8d%bc%ec%8a%a4-%eb%9d%bc%ec%9d%b4%ec%84%a0%ec%8a%a4-%ec%86%8c%ed%94%84%ed%8a%b8%ec%9b%a8%ec%96%b4/
        checked: 2026-11-04
      - text: Microsoft 365는 https://mso365.snu.ac.kr/ 에서 개인정보 동의 후 SNU 아이디와 비밀번호로 써요. OneDrive 1GB와 Exchange 1GB를 주고, 재학생은 졸업하면 쓸 수 없어요.
