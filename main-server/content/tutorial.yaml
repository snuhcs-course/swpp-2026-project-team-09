            - { icon: info, words: 금요일은 16:30까지 }
          actions:
            - { kind: route, words: 길찾기 }
            - {
                kind: link,
                words: 진료 예약,
                url: 'https://health4u.snu.ac.kr/medicalTreatment/newAppointment/_/init.do',
