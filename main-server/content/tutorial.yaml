      - text: 유실물을 받을 때는 서약서를 쓰고 분실 장소·날짜·시간을 확인해요. 신분증·학생증은 본인 신분을 대조하고, 휴대폰·전자기기는 연락처와 블루투스 자동 연결을 확인해요.
