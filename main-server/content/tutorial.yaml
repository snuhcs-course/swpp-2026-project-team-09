quests:
  - key: s-card
    order: 1
    category: life
    icon: idcard
    title: 학생증(S-CARD) 발급받기
    brief: 학생증(S-CARD)을 신청하고 받아 보세요.
    body:
      - 학생증(S-CARD)은 도서관 출입처럼 학교생활 곳곳에서 써요.
      - '· 신청: MySNU에서 온라인으로 신청해요.'
      - '· 수령: 신청한 다음 날부터 학생지원센터(67동 NH농협두레문예관 2층)에서 받아요. 평일 9:00–17:50에 열어요.'
      - · 금융 기능이 있는 학생증은 우리은행(4동)에서 처리해요. 교환학생은 금융 학생증을 받을 수 없어요.
      - · 모바일 학생증은 '서울대학교' 앱에서 쓸 수 있어요.
    condition: 학생증 받기
    completion:
      kind: button
    completionMessage: 학생증을 받았군요! 이제 도서관과 학교 시설을 마음껏 이용해 보세요.
    places:
      - place: '67'
        floor: 2
      # The campus map names Place 4 신양인문학술정보관; the bank is inside it.
      - place: '4'
        label: 우리은행 (4동)
    links:
      - label: MySNU
        url: https://my.snu.ac.kr
      # student.snu.ac.kr › 대학생활 › 기타 › S-CARD › 발급 절차, copied from the site on 2026-11-01.
      - label: 학생처 S-CARD 발급 절차
        url: https://student.snu.ac.kr/%eb%8c%80%ed%95%99%ec%83%9d%ed%99%9c/%ea%b8%b0%ed%83%80/s-card/%eb%b0%9c%ea%b8%89-%ec%a0%88%ec%b0%a8/
    # The body's 수령 line.
    visit:
      note: 학생증은 MySNU 신청 다음 날부터 받아요 · 평일 09:00–17:50
      hours:
        - days: [monday, tuesday, wednesday, thursday, friday]
          open: ['09:00-17:50']
    # The board MainTutorialCard1–6. The steps follow student.snu.ac.kr › S-CARD › 발급 절차 (read again on
    # 2026-11-18): one card a person, 일반 or 금융; the MySNU menu to apply in is named S-CARD 분실신고.
    guide:
      kinds:
        - key: plain
          label: 일반
          icon: idcard
          title: 일반 학생증
          route: [MySNU, 학생지원센터]
          steps:
            - tab: 신청
              title: 온라인 신청
              rows:
                - words: MySNU 로그인
                - words: 캠퍼스·복지
                - words: S-CARD(학생증)
                - words: S-CARD 분실신고
                  note: 여기서 신청
              actions:
                - kind: link
                  words: MySNU
                  url: https://my.snu.ac.kr
            - tab: 수령
              title: 방문 수령
              place: { place: '67' }
              name: 학생지원센터
              sub: 67동 · 두레문예관 2층
              chips:
                - { icon: calendar, words: 신청 다음 날부터 }
                - { icon: clock, words: 평일 09:00–17:50 }
                - { icon: idcard, words: 신분증 }
              actions:
                - { kind: route, words: 길찾기 }
            - &mobile-card
              tab: 모바일
              title: 모바일 학생증
              optional: true
              rows:
                - words: 서울대학교 앱
                - words: 하단 가운데 '샤'
                - words: 모바일 S-CARD 발급
              chips:
                - { icon: info, words: 카드형 없으면 1개월만 }
        - key: financial
          label: 금융
          icon: bank
          title: 금융 학생증 (체크카드)
          route: [우리은행, 학생지원센터]
          steps:
            - tab: 발급
              title: 은행에서 발급
              place: { place: '4' }
              name: 우리은행
              sub: 4동 · 신양학술정보관
              chips:
                - { icon: idcard, words: 신분증 }
                - { icon: info, words: 교환학생은 불가 }
              actions:
                - { kind: route, words: 길찾기 }
            - tab: 정보 등록
              title: 학생 정보 넣기
              place: { place: '67' }
              name: 학생지원센터
              sub: 67동 · 두레문예관 2층
              chips:
                - { icon: clock, words: 평일 09:00–17:50 }
                - { icon: grade, words: 신청서 작성 }
              actions:
                - { kind: route, words: 길찾기 }
