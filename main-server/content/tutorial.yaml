    places:
      - place: '63'
        floor: 3
    links:
      - label: 보건진료소 홈페이지
        url: https://health4u.snu.ac.kr/index.do
      - label: 진료 시간표
        url: https://health4u.snu.ac.kr/medicalTreatment/PracticeSchedule/_/view.do
      - label: 오시는 길
        url: https://health4u.snu.ac.kr/operation/guide/_/view.do
      - label: 이용 절차
        url: https://health4u.snu.ac.kr/operation/useProcedure/_/view.do
      - label: 진료 예약
        url: https://health4u.snu.ac.kr/medicalTreatment/newAppointment/_/init.do
    facts:
      - text: 학생회관(63동) 3–4층에 있어요. 진료는 3층에서 하고, 접수와 수납은 329호에서 해요.
        source: https://health4u.snu.ac.kr/operation/guide/_/view.do
        checked: 2026-11-02
      - text: 평일 09:00–12:00, 13:30–17:30에 진료해요. 금요일은 16:30까지예요. 12:00–13:30에는 진료하지 않아요.
        source: https://health4u.snu.ac.kr/index.do
        checked: 2026-11-02
      - text: 진료과는 가정의학과, 내과, 정신건강의학과, 이비인후과, 피부과, 안과, 부인과, 정형외과, 금연클리닉, 비만클리닉, 치과예요.
        source: https://health4u.snu.ac.kr/operation/contact/_/view.do
        checked: 2026-11-02
      - text: 진료 당일 신분증을 들고 329호에서 접수해요. 예약 없이도 진료받을 수 있어요.
        source: https://health4u.snu.ac.kr/operation/useProcedure/_/view.do
        checked: 2026-11-02
      - text: 예약은 선택이에요. 진료일 하루 전까지 홈페이지에서 온라인으로 예약해요. 전화로는 예약할 수 없어요.
        source: https://health4u.snu.ac.kr/operation/useProcedure/_/view.do
        checked: 2026-11-02
      - text: 정신건강의학과는 예약해야 진료받을 수 있어요. 방문하거나 02-880-5347로 전화해 예약해요.
        source: https://health4u.snu.ac.kr/operation/useProcedure/_/view.do
        checked: 2026-11-02
      - text: 건강보험 가입자는 진찰료 없이 검사·처치 비용 일부만 내요. 미가입자는 할인된 진찰료와 검사·처치 비용 일부를 내요.
        source: https://health4u.snu.ac.kr/noti/faq/_/list.do
        checked: 2026-11-02
      - text: 대표전화는 02-880-5338이에요.
        source: https://health4u.snu.ac.kr/operation/guide/_/view.do
        checked: 2026-11-02

