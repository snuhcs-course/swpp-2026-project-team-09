    brief: 동아리가 아니어도 혼자 악기나 춤을 연습할 방을 빌릴 수 있어요.
    body:
      - NH농협두레문예관(67동)에는 연습실 7개 호실이 있어요. 동아리뿐 아니라 재학생 개인도 예약할 수 있어요.
      - · 예약하샤에서 빈 호실을 찾아 신청하면 두레운영실이 검토하고, 결과를 이메일로 보내요. 승인까지 1–3일 걸려요.
      - · 개인은 15일 안의 날짜를 한 번에 3시간까지 예약할 수 있어요. 사용 당일 예약은 승인되지 않아요.
    condition: 두레문예관 연습실 예약 방법 확인하기
    completion:
      kind: button
    completionMessage: 마음껏 연습할 공간이 생겼어요. 즐겁게 연습하세요!
    places:
      - place: '67'
    links:
      - label: 학생처 연습실 안내
        url: https://student.snu.ac.kr/%eb%8c%80%ed%95%99%ec%83%9d%ed%99%9c/%eb%ac%b8%ed%99%94%c2%b7%ec%98%88%ec%88%a0/%ec%97%b0%ec%8a%b5%ec%8b%a4/
    # Left out, as the page does not state it: whether a room costs anything, and what each room holds.
    facts:
      - text: NH농협두레문예관(67동) 연습실은 총 7개 호실이고, 학내 학생단체(동아리)나 재학생 개인이 예약해 쓸 수 있어요.
        source: https://student.snu.ac.kr/%eb%8c%80%ed%95%99%ec%83%9d%ed%99%9c/%eb%ac%b8%ed%99%94%c2%b7%ec%98%88%ec%88%a0/%ec%97%b0%ec%8a%b5%ec%8b%a4/
        checked: 2026-11-04
      - text: 예약하샤에서 빈 호실을 확인해 신청하면 두레운영실이 검토하고, 처리 결과는 신청자 이메일로 자동 발송돼요. 1–3일 걸려요.
        source: https://student.snu.ac.kr/%eb%8c%80%ed%95%99%ec%83%9d%ed%99%9c/%eb%ac%b8%ed%99%94%c2%b7%ec%98%88%ec%88%a0/%ec%97%b0%ec%8a%b5%ec%8b%a4/
        checked: 2026-11-04
      - text: 재학생 개인은 15일 이내 날짜를 1회 3시간까지, 두레 단체ID가 있는 단체는 30일 이내 날짜를 1회 6시간까지 예약할 수 있어요. 사용 당일 예약은 승인되지 않아요.
