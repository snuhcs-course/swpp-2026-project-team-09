# Class on Tuesday at 13:00. Written and committed, not run: no model key on this machine.
- id: meal-wish-class-cancelled
  category: meal-wishes
  world: p4-answer
  repeat: 3
  turns:
    - user: 내일 11시 수업 휴강이야. 점심 뭐 먹을까?
  expect:
    actions: [TOOL]
    tools:
      required: [planMeal]
      forbidden: [getMenus, showOnMap, findMenu, proposeQuest]
    args:
      planMeal: { date: '2026-11-03', meal: lunch, skipClasses: ['11:00'] }
    text:
      mentions: [[빼고, 뺐, 빼서]]
      absent: [반영하지 못, 아직]

