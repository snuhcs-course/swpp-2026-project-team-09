# A plan of the meal answer on screen chosen in words keeps the answer, its list and its numbers (P05 ticket 51). On
# the user's phone (2026-11-26), "2번으로 할게" over a dinner answer of six places was planned again at its 2번 alone,
# numbered 1, and the reply described the place. The second turn sends the first answer on screen, as the app does.
- id: meal-choose-by-number
  category: meal-wishes
  world: p4-answer
  live: true
