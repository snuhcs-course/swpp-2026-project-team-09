# Choosing what or where to eat is planned on the map (P05 ticket 14). In use of the released app, "월요일에 밥 뭐
# 먹을까" was asked back in text ("어떤 종류가 당기세요? … 점심인지 저녁인지도 알려 주세요"), and "한식" was then
# answered with a list of every Restaurant's dishes. Only a question about what a named Restaurant serves stays a menu
# question. The P4 world asked from an app that draws answers (`pnpm eval --world p4-answer`), on Monday 2026-11-02 at
# 11:30, with menus from Monday to Thursday.

- id: meal-wish-monday
  category: meal-wishes
  world: p4-answer
  repeat: 3
  turns:
    - user: 월요일에 밥 뭐 먹을까
  expect:
    actions: [TOOL]
    tools:
      required: [planMeal]
      forbidden: [getMenus, showOnMap, findMenu, proposeQuest]
    args:
      planMeal: { date: '2026-11-02' }
    text:
      absent: [어떤 종류, 당기, 점심인지 저녁인지]

