# A Restaurant's hours are answered from restaurantHours, never as missing data (P05 ticket 36): on the released app,
# "예술계 밥 언제까지 해?" got "영업 종료 시간은 데이터에 없어서 확인되지 않아요". The P4 world asked from an app that
# draws answers (`pnpm eval --world p4-answer`), on Monday 2026-11-02 at 11:30. Its menus carry no hours, so the reply
# says what the menu shows and that the hours are not known. Written and committed, not run.

- id: restaurant-hours-closing
  category: restaurant-hours
  world: p4-answer
  repeat: 3
  turns:
    - user: 학생회관식당 점심 언제까지 해?
  expect:
    actions: [TOOL]
    tools:
      required: [restaurantHours]
      forbidden: [findMenu, planMeal, getMenus]
    text:
      absent: [데이터에 없, 데이터가 없]

