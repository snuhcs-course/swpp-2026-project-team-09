# Ambiguous intent: one sentence that reads as two requests, one of them a lookup. The one right answer (P20's plan,
# 3-1) is TOOL+ASK: the lookup at once, and in the same reply one question about the other reading. The prompt has no
# such rule yet, so every case here is a known failure until 3-1. Places are named in full (학생회관, never 학관), so
# that each known failure has one cause.

- id: ambiguous-intent-lunch-at-student-center
  category: ambiguous-intent
  knownFailure: No rule for ambiguous intent until improvement 3-1 (show one reading, ask about the other)
  turns:
    - user: 내일 학생회관에서 점심
  expect:
    actions: [TOOL+ASK]
    tools:
      required: [getMenus, showOnMap]
      allowed: [resolvePlace]
      forbidden: [proposeQuest]
