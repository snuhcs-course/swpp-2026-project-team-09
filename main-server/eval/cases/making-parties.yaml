# With a related event and no time, the Quest starts with the event.
- id: making-parties-for-event
  category: making-parties
  turns:
    - user: 가을 재즈 콘서트 같이 갈 사람 나 포함 3명, 공개로 모집해줘
  expect:
    actions: [PROPOSE]
    tools:
      required: [proposeQuest]
      allowed: [resolveGlobalEvent, searchGlobalEvents]
    proposal:
      joinPolicy: open
      board: show
      capacity: 3
      startsAt: '2026-10-22 19:00'
      globalEvent: 가을 재즈 콘서트

# "학관" is 학생회관 (63동) to students. resolvePlace reads the short form (P07 ticket 01) and answers several, since the
# 관악사 학부 생활관 buildings and 유회진 학술정보관 shorten to it too, so the Assistant asks which one, naming 학생회관,
# and never picks.
- id: making-parties-abbreviation-hakgwan
  category: making-parties
  turns:
    - user: 내일 점심 학관에서 이민수랑 밥 약속 잡아줘
  expect:
    actions: [ASK]
    tools:
      required: [resolvePlace]
      allowed: [resolveFriend, proposeQuest]
    args:
      resolvePlace: { words: 학관 }
    text:
      mentions: [학생회관]

