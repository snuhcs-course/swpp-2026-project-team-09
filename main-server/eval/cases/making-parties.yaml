# Making a Quest: a Proposal with the right fields. P07's open questions: 아침, 점심 and 저녁 start at 08:00, 12:00 and
# 18:00; every Friend, Place and event is resolved before proposeQuest. A Quest with named Friends only is closed (비공개),
# on no Board, and its capacity counts the User. Starts are written in Korea's time.

- id: making-parties-lunch-with-friend
  category: making-parties
  repeat: 3
  turns:
    - user: 내일 점심 학생회관에서 이민수랑 밥 약속 잡아줘
  expect:
    actions: [PROPOSE]
    tools:
      required: [resolveFriend, resolvePlace, proposeQuest]
    args:
      resolveFriend: { name: 이민수 }
      resolvePlace: { words: 학생회관 }
    proposal:
      joinPolicy: closed
      board: null
      capacity: 2
      startsAt: '2026-10-22 12:00'
      place: 학생회관
      invitees: [이민수]

