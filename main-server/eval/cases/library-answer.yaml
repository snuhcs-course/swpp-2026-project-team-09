# A study seat asked for from the current app (`capabilities: app`), which draws answers on the map, in the P6 world on
# Wednesday 2026-11-04 at 10:05 (P05 ticket 34). Today's seat is filled from when the User arrives at 관정관 and shown as
# a book card. The library books a seat on its day only, so a seat for a later day is refused at once, with or without a
# time: the reply says so and that the User can ask again that day, and asks nothing back. These cases stay out of the
# frozen P6 suite (`pnpm eval --world p6-answer`).

- id: library-answer-seat-today
  category: library-answer
  world: p6-answer
  capabilities: app
  repeat: 3
  turns:
    - user: 공부할 자리
  expect:
    actions: [TOOL]
    tools:
      required: [findLibrarySpace, proposeLibraryBooking]
      only: true
    cards:
      - { kind: library, action: book, space: 7F-7A-zone2, min: 1, max: 1 }
    text:
      absent: [몇 시부터]

- id: library-answer-seat-tomorrow
  category: library-answer
  world: p6-answer
  capabilities: app
  repeat: 3
  turns:
    - user: 내일 공부할 자리
  expect:
    actions: [REFUSE]
    tools:
      required: [findLibrarySpace, proposeLibraryBooking]
      only: true
    cards:
      - { kind: library, max: 0 }
    text:
      mentions: [당일]
      absent: [몇 시부터, 예약할까요]

- id: library-answer-seat-tomorrow-at-nine
  category: library-answer
  world: p6-answer
  capabilities: app
  repeat: 3
  turns:
    - user: 내일 아침 9시에 공부할 자리 잡아 줘
  expect:
    actions: [REFUSE]
    tools:
      required: [findLibrarySpace, proposeLibraryBooking]
      only: true
    cards:
      - { kind: library, max: 0 }
    text:
      mentions: [당일]
      absent: [몇 시부터, 예약할까요]

# A reading room asked for after its closing gets no card and one sentence: when it closed and when it opens next
# (P05 ticket 57). On the user's phone (2026-11-26, 23:37), "관정 열람실 자리 있어?" was answered with four sentences that
# named a seats card no one could see. The clock stands at 23:37 on the world's Wednesday.
- id: library-answer-closed-for-today
  category: library-answer
  world: p6-answer
  capabilities: app
  now: '2026-11-04T23:37:00+09:00'
  repeat: 3
  turns:
    - user: 관정 열람실 자리 있어?
  expect:
    actions: [REFUSE]
    tools:
      required: [findLibrarySpace]
      allowed: [showLibrarySeats, proposeLibraryBooking]
    cards:
      - { kind: library, max: 0 }
    text:
      mentions: ['23:00', '07:00']
      absent: [카드]

# Whether a return went through is answered with the User's bookings, each with its state, and one sentence that says
# so, names no card and never says whether the return went through (P05 ticket 59). On the user's phone (2026-11-27),
# "반납 잘 됐니?" was refused as something the Assistant cannot see. This supersedes the frozen P6 suite's
# p6-bookings-did-i-return, which expected that refusal (eval/p6/suite.yaml, `supersededAfterFreeze`).
#
# "반납해줘" for a seat booked through the app and not yet in use, which shows the cancel card, has no case here: the P6
# world holds no seat-stay Quest, and one added to it would change the frozen P6 cases' answers, p6-bookings-return's
# among them. test/assistant-library-cards.integration.test.ts checks it with the scripted model.
- id: library-answer-did-i-return
  category: library-answer
  world: p6-answer
  capabilities: app
  repeat: 3
  turns:
    - user: 반납 됐어?
  expect:
    actions: [TOOL]
    tools:
      required: [showMyLibraryBookings]
      only: true
    cards:
      - { kind: library, action: myBookings, min: 1, max: 1 }
      - { kind: library, action: return, max: 0 }
      - { kind: library, action: cancel, max: 0 }
    text:
      absent: [볼 수 없, 확인할 수 없, 알 수 없, 보이지 않, 카드, 반납됐어요, 반납되었어요, 반납했어요, 반납하셨어요]
