# A menu question's answer is the Restaurant opened as a meal plan's place (P04 ticket 72): when findMenu finds its menu
# and the User has time to eat there, the app shows the menu, the time, and the way, and the reply writes nothing. On
# 2026-11-26 the reply wrote the menu as a paragraph over the same menu. The P4 world asked from an app that draws
# answers (`pnpm eval --world p4-answer`), on Monday 2026-11-02 at 11:30, the question `menu-collected` asks.

- id: menu-found-writes-nothing
  category: menu-answer-view
  world: p4-answer
  repeat: 3
  turns:
    - user: 오늘 학생회관식당 점심 뭐야?
  expect:
    actions: [TOOL]
    tools:
      required: [findMenu]
      forbidden: [getMenus, showOnMap]
    text:
      none: true

