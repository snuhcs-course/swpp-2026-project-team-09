# A 파티 or 약속 only with Friends the User names is a meeting planned on the map (P05 ticket 26), with the place and
# the time they fixed. When the time does not fit, the reply says why and offers the nearest: a Friend only by when
# their Class ends, the asker's own Class by its name. The P4 world asked from the current app (`capabilities: app`,
# which draws meets), on Monday 2026-11-02 at 11:30. On Tuesday the asker has 데이터베이스 11:00–12:15 and 운영체제
# 15:00–16:15; 이민수 has Classes 10:00–11:15 and 16:00–18:30; 김지은 has one 13:00–14:15. A meet with no place cannot be
# planned in this world (see the last case), so the others name 학생회관.

- id: meet-at-a-fitting-time
  category: meet-at
  world: p4-answer
  capabilities: app
  repeat: 3
  turns:
    - user: 내일 이민수랑 학생회관에서 두시에 만나는 파티 만들어줘
  expect:
    actions: [TOOL]
    tools:
      required: [planMeet]
      allowed: [resolveFriend, resolvePlace, findDay]
      forbidden: [proposeQuest]
    args:
      planMeet: { date: '2026-11-03', at: '14:00' }
    text:
      absent: [수업, 안 돼, 어려워]

