# The second plan chosen by number over the study answer on screen.
- id: study-plan-choose-second
  category: study-plan
  world: p6-answer
  capabilities: study-app
  live: true
  screen: true
  repeat: 3
  turns:
    - user: 공부할 자리 있어?
      expect:
        actions: [TOOL]
        tools:
          required: [planStudy]
    - user: 2번으로 할게
      expect:
        actions: [TOOL]
        tools:
          required: [choosePlan]
          forbidden: [planStudy, findLibrarySpace, showOnMap]
        args:
          choosePlan: { number: 2 }

