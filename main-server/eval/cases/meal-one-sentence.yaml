# A meal's reply is one sentence about the first plan, with nobody's minutes on the way: the app writes the ways and
# their minutes on the map. On the user's phone on 2026-11-26, "저녁" alone was answered "예술계식당이 가장 가까워서
# 17:00에 먹어요. 83동에서 도보 3분이에요." The server also drops such a sentence (`withoutWalkSentences`); this case
# holds the model to the rule. The P4 world asked from an app that draws answers (`pnpm eval --world p4-answer`), on
