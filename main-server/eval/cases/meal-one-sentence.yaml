  expect:
    actions: [TOOL]
    tools:
      required: [planMeal]
      forbidden: [getMenus, showOnMap, findMenu]
    args:
      planMeal: { date: '2026-11-02', meal: dinner }
    text:
      absent: [도보, 분 걸려, 분 거리, 걸어서 1분, 걸어서 2분, 걸어서 3분, 걸어서 4분, 걸어서 5분]
