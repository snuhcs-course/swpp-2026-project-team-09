# The 40 questions of the P4 suite, without their answers.
#
# You work each answer by hand from three other files and nothing else: rules.md (the judgement), world.yaml (the
# world) and travel-fixture.json (every Travel Time). Write down the working. Where the rules leave an answer open, do
# not guess silently: say so in `working` and set `open: true`.
#
# ----------------------------------------------------------------------------------------------------------------------
# HOW TO READ A CASE
#
#   id        its name
#   category  free-time-parties (공강 파티), free-time-meals (공강에 밥) or free-time-common (공통)
#   now       the time the case stands at, in Korea. "오늘" is this date. The week runs Monday 2026-11-02 to Sunday 11-08.
#   asker     who asks: `김하늘`, the world's `asker`, or `새내기`, the User of that name in `askers`
#   turns     the conversation. `user` is the User's message; `assistant` is the Assistant's earlier reply, with the
#             cards it showed, as the app sends it back. Earlier turns are history: only the LAST user turn is answered,
#             and it is the only turn sent to the model. Tool results do not carry over from the earlier turns.
#
# ----------------------------------------------------------------------------------------------------------------------
# THE FORM OF AN ANSWER
#
# For each case, one entry in an answers file, with this form. The names in this example are made up.
#
#   - id: some-case-id
#     expect:
#       actions: [TOOL]
#       tools:
#         required: [findFreeTimeEvents, showQuests, showGlobalEvents]
#         allowed: [getMyDay]
#         forbidden: [proposeQuest, searchRecruitingQuests]
#       args:
#         findFreeTimeEvents: { date: '2026-11-02' }
#       cards:
#         - { kind: quest, seeds: [어떤 파티], max: 1 }
#         - { kind: globalEvent, seeds: [어떤 행사, 다른 행사], max: 2 }
#       text:
#         mentions: [[12:15, 12시 15분], [14:00, 2시, 오후 2시], [3개, 세 개]]
#         absent: [홍길동]
#       results:
#         findFreeTimeEvents:
#           args: { date: '2026-11-02', from: 어떤 수업 (월), to: 다른 수업 (월) }
#           result: found
#           gaps:
#             - { start: '12:15', end: '14:00', before: 어떤 수업, after: 다른 수업 }
#           candidates:
#             - kind: quest
#               seed: 어떤 파티
#               start: '12:45'
#               end: null
#               travel: { mode: shuttle, minutes: 16 }
#               leaveBy: '13:51'
#               endUnknown: true
#     working: |
#       The steps, with the seconds and times used, candidate by candidate, including those left out and why.
#
# ----------------------------------------------------------------------------------------------------------------------
# EVERY FIELD OF `expect`
#
# How a case is scored: it passes when the action is one it accepts and every check below that it gives holds. A field
# left out is not checked, so give every field the rules decide.
#
# actions (required): the kinds of action accepted, any one of which passes, usually one.
#   TOOL         the reply shows cards or a map button, or a lookup found data and the text answers in words, or a
#                lookup found nothing and the text says so (which needs `text.mentions`)
#   ASK          nothing shown; the reply asks the User back. Needs `text.mentions`: what the question must hold.
#   PROPOSE      the reply carries a Proposal from proposeQuest
#   REFUSE       no tool called; the Assistant declines
#   CHAT         no tool called; it just talks
#   TOOL+ASK     TOOL, and the text also asks. Needs `text.mentions`.
#   PROPOSE+ASK  PROPOSE, and the text also asks. Needs `text.mentions`.
#   A tool answering `needs`, resolveFriend or resolvePlace answering `several` or `none`, or proposeQuest refusing is
#   read as calling for a question.
#
# tools: the tools by name (rules.md section 11).
#   required   every one must be called
#   allowed    may be called, and are not needed
#   forbidden  none may be called; "*" means no tool at all. A tool the case must not use goes here.
#   A tool in none of the three may be called and only counts against efficiency. That is how tool choice is scored: a
#   case that needs a tool requires it, and one that must not use it forbids it.
#
# args: for a required tool, the arguments a call must hold. Only the fields given are compared, so give only what the
#   rules decide from the User's words. A list of objects means one call with each. Written so:
#     date             YYYY-MM-DD
#     from, to         an item by seed name; a clock time HH:MM; now; or end
#     board            meal, career, hobby or show
#     meal             lunch or dinner
#     window           { from: HH:MM, to: HH:MM }
#     friends          a list of Friends by seed name, compared as a set (the tools' `friendIds`)
#     departurePlace   a Place by seed name
#     leaveBy          HH:MM
#     keys             showRestaurants: a list of Restaurants by key, compared as a set
#     ids              showQuests, showGlobalEvents: a list by seed name, compared as a set
#     name             resolveFriend: the User's word for the Friend
#     words            resolvePlace: the User's words for the Place
#     layer            showOnMap: dining or shuttle
#     from, to         searchRecruitingQuests, searchGlobalEvents: YYYY-MM-DD
#     startsAt         proposeQuest: 'YYYY-MM-DD HH:MM'
#     place, invitees  proposeQuest: a Place by seed name; a list of Friends by seed name
#     joinPolicy, board, capacity, title, description  proposeQuest: as given
#
# proposal: the fields the reply's Proposal must hold, when the action is PROPOSE: joinPolicy (open, approval or closed),
#   board (null for none), capacity, startsAt ('YYYY-MM-DD HH:MM'), place (Place by seed name, or null), globalEvent
#   (null for none), invitees (Friends by seed name). A Restaurant card's own Proposal is not scored.
#
# cards: one entry per kind: { kind: quest | globalEvent | restaurant, seeds: [...], min: n, max: n }.
#   seeds  the cards of that kind that must be shown, by seed name (a Restaurant by its key)
#   max    how many of that kind may be shown at most
#   min    how many at least
#   A case checks exactly the cards: give every seed and `max` equal to their number. For a kind that must not be shown,
#   give { kind: ..., seeds: [], max: 0 }. Order is not checked here; it is in `results`.
#
# mapButtons: the map buttons of the reply, all and only those: [dining], [shuttle] or [].
#
# text: the reply's words. Spaces are ignored and a word is found anywhere in the text.
#   mentions  what the text must hold: each entry a word, or a list of which any one counts. Give the spellings a reply
#             may fairly use, such as [12:15, 12시 15분].
#   absent    words the text must not hold, such as the full stored names of Friends who are not free. Give full names:
#             민수 would also match 이민수.
#
# results: what each 공강 tool must answer, for the check of the server's judgement. It is not scored on the model. Give
#   it for every 공강 tool the case requires, except showRestaurants. Each entry has `args`, the complete arguments that
#   call uses, written as above, whatever the model passes, and then:
#
#   getMyDay
#     result: found
#     items: [{ seed, start, end }]  each item of the day, by item seed name
#
#   findFreeTimeEvents, when it answers
#     result: found  (also when nothing fits)
#     gaps: [{ start, end, before, after }]  before and after are the names of the items around it, or null
#     candidates: every candidate that fits, in order, not cut to 20:
#       kind: quest or globalEvent
#       seed: its title
#       start, end: of what was judged; end is null when there is none
#       travel: { mode: walk or shuttle, minutes }, or null with no previous item
#       next: { minutes, isClass }  when the rules give it
#       leaveBy: HH:MM  when the rules give it
#       endUnknown: true  when the rules give it
#     Give `next`, `leaveBy` and `endUnknown` only when they apply (rules.md section 7).
#
#   findFreeTimeEvents, when it needs an answer
#     result: needs
#     needs: { side: before or after, item: the item's name }
#
#   findFreeFriends
#     result: found
#     freeTime: [{ start, end }]  the User's Free Time in the window
#     friends: [{ seed, overlap: [{ start, end }] }]  the free Friends, by seed name
#     shared: [{ start, end }]  only with `friends` in its args
#
#   findMealRestaurants, when it answers
#     result: found  (also when no Restaurant fits)
#     shared: [{ start, end }]
#     restaurants: in order:
#       seed: the Restaurant's key
#       start: its Start
#       eatingMinutes: 식사 가능 시간, as shown
#       people: [{ name, mode, minutes, longest }]  name is 나 or the Friend's stored name; mode and minutes are null for "—"
#
#   findMealRestaurants, when there is nothing to judge
#     result: none
#     why: no-menu or no-shared-time
#
#   findMealRestaurants, when it needs an answer: as for findFreeTimeEvents.
#
#   Times are HH:MM. The end of a day is 24:00.
#
# working: your steps in plain words. It is not scored. A person reviews every answer from it.
# open: true  only when the rules leave this answer open; say why in `working`.
#
# ----------------------------------------------------------------------------------------------------------------------
# SEED NAMES
#
#   A Place               its key under `places`, such as 제1공학관
#   A Friend              its key under `friends`, such as 이민수 or 박서준 (경영학과)
#   A Quest, Global Event its title
#   A Restaurant          its key under `restaurants`, such as 학생회관식당
#   An item of the asker  <name> (<요일>): a Class meeting, such as 멀티코어컴퓨팅 (월), or a Quest held, by its title, such
#                         as 과외 (목). These are the ids `from` and `to` take. The asker's items are: their Timetable's
#                         meetings; 공모전 작업 (수) and 과외 (목) of `ownQuests`; and 수요일 점심 모임 (수), which they joined.
#
# WHAT THE RESOLVERS ANSWER
#
#   resolveFriend matches any part of a stored name, so the world's Friends answer as you can read off `friends`:
#   민수 is 이민수 alone, 지은 is 김지은, 서준 is the two 박서준, and each of 유진, 하람, 도윤, 지호 and 민재 is one Friend.
#   resolvePlace looks through all the campus's Places, more than the world uses. 서울대 정문 answers `one`, that Place.
#   낙성대역 answers `none`: it is off campus.
#
# ----------------------------------------------------------------------------------------------------------------------

