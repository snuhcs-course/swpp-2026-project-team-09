# The 새내기 튜토리얼 (README.md: Tutorial). The server checks this file when it starts and serves it with GET /tutorial,
# so the app keeps no copy. Each entry is one Tutorial Quest, shown in `order`. Adding a quest is an entry here.
#
# A place is a Place of the shared seed by its number (seed/campus-map-places.json and the others), with the floor and
# the label shown when they help, or a point with its label. A completion is `button` (완료했어요), or `kwanjeongCheck`,
# which the phone checks against the User's library bookings, with the label of its skip.
# `facts` are what the Assistant answers from beyond the sheet's text (getTutorial), each with its source and the day
# it was checked; GET /tutorial does not serve them. A fact the source does not state is left out, and the Assistant
# answers it as 확인되지 않아요 with the quest's link.
#
# The texts marked *drafted* in the P06 spec (the briefs, conditions and completion messages of the quests other than
# kwanjeong) wait for the owner's review before the P6 eval set freezes them.

quests:
  - key: s-card
    order: 1
    title: 학생증(S-CARD) 발급받기
    brief: 학생증(S-CARD)을 신청하고 받아 보세요.
    body:
      - 학생증(S-CARD)은 도서관 출입처럼 학교생활 곳곳에서 써요.
      - '· 신청: MySNU에서 온라인으로 신청해요.'
      - '· 수령: 신청한 다음 날부터 학생지원센터(67동 NH농협두레문예관 2층)에서 받아요. 평일 9:00–17:50에 열어요.'
      - · 금융 기능이 있는 학생증은 우리은행(4동)에서 처리해요. 교환학생은 금융 학생증을 받을 수 없어요.
      - · 모바일 학생증은 '서울대학교' 앱에서 쓸 수 있어요.
    condition: 학생증 받기
    completion:
      kind: button
    completionMessage: 학생증을 받았군요! 이제 도서관과 학교 시설을 마음껏 이용해 보세요.
    places:
      - place: '67'
        floor: 2
      # The campus map names Place 4 신양인문학술정보관; the bank is inside it.
      - place: '4'
        label: 우리은행 (4동)
    links:
      - label: MySNU
        url: https://my.snu.ac.kr
      # student.snu.ac.kr › 대학생활 › 기타 › S-CARD › 발급 절차, copied from the site on 2026-11-01.
      - label: 학생처 S-CARD 발급 절차
        url: https://student.snu.ac.kr/%eb%8c%80%ed%95%99%ec%83%9d%ed%99%9c/%ea%b8%b0%ed%83%80/s-card/%eb%b0%9c%ea%b8%89-%ec%a0%88%ec%b0%a8/

  - key: admin-shuttle
    order: 2
    title: 행정관 셔틀 이용하기
    brief: 행정관 앞에서 셔틀을 타 보세요.
    body:
      - 행정관 셔틀은 행정관 잔디광장 아래 정류장에서 타요. 카카오맵에서 '메가커피'를 검색하면 정류장을 찾기 쉬워요.
      - 셔틀 대신 5511, 5513, 5516번 버스를 타도 돼요.
    condition: 행정관 셔틀 타 보기
    completion:
      kind: button
    completionMessage: 셔틀 타 보니 어떠셨나요? 캠퍼스 이동이 한결 편해질 거예요!
    places:
      # The middle of the plus code 8Q98FX62+94.
      - point:
          latitude: 37.460938
          longitude: 126.950312
        label: 행정관 셔틀 정류장 (행정관 잔디광장 아래)
    links: []

  - key: kwanjeong
    order: 3
    title: 관정도서관 예약하기
    brief: 관정도서관 열람실을 예약하고 이용해 보세요.
    body:
      - 관정도서관은 관정도서관 내부 키오스크에 로그인한 후 좌석을 예약하거나, 관정도서관 공식 앱, 또는 이 SNU Now에서 어시스턴트에게 부탁해 예약을 진행할 수 있어요. 이번 튜토리얼에서는 관정도서관을 이용해보세요!
      - 열람실 좌석은 예약한 뒤 30분 안에 좌석배정기(키오스크)에서 확인해야 해요. 확인하지 않으면 자동으로 반납돼요.
      - 확인하지 않거나 반납하지 않은 일이 한 달에 5번이면 10일 동안 예약할 수 없어요. 그룹스터디룸은 1시간 안에 들어가지 않으면 취소되고, 7일에 3번이면 3일 동안 예약할 수 없어요.
      - 사용 다했으면 꼭 반납처리를 해주세요! 저한테 말해주셔도 되고 키오스크를 이용해 반납하셔도 돼요!
    condition: 관정도서관 열람실이나 스터디룸 예약 및 이용
    completion:
      kind: kwanjeongCheck
      skipLabel: 이미 예약 및 이용해본 적이 있어요
    completionMessage: 관정도서관 이용은 어떠셨나요? 도서관을 자주 이용해 보아요!
    places:
      - place: '62-1'
    links: []

  - key: health-clinic
    order: 4
    title: 서울대 보건진료소 이용
    brief: 보건진료소가 어디 있는지 알아 두세요.
    body:
      - 서울대 보건진료소는 학생회관(63동) 3–4층에 있어요. 진료는 3층에서 하고, 접수와 수납은 329호에서 해요. 진료 시간과 이용 방법은 보건진료소 홈페이지에서 확인할 수 있어요.
    condition: 보건진료소 위치와 이용 방법 확인하기
    completion:
      kind: button
    completionMessage: 아플 땐 참지 말고 보건진료소를 찾아 주세요!
    places:
      - place: '63'
        floor: 3
    links:
      - label: 보건진료소 홈페이지
        url: https://health4u.snu.ac.kr/index.do
      - label: 진료 시간표
        url: https://health4u.snu.ac.kr/medicalTreatment/PracticeSchedule/_/view.do
      - label: 오시는 길
        url: https://health4u.snu.ac.kr/operation/guide/_/view.do
      - label: 이용 절차
        url: https://health4u.snu.ac.kr/operation/useProcedure/_/view.do
      - label: 진료 예약
        url: https://health4u.snu.ac.kr/medicalTreatment/newAppointment/_/init.do
    facts:
      - text: 학생회관(63동) 3–4층에 있어요. 진료는 3층에서 하고, 접수와 수납은 329호에서 해요.
        source: https://health4u.snu.ac.kr/operation/guide/_/view.do
        checked: 2026-11-02
      - text: 평일 09:00–12:00, 13:30–17:30에 진료해요. 금요일은 16:30까지예요. 12:00–13:30에는 진료하지 않아요.
        source: https://health4u.snu.ac.kr/index.do
        checked: 2026-11-02
      - text: 진료과는 가정의학과, 내과, 정신건강의학과, 이비인후과, 피부과, 안과, 부인과, 정형외과, 금연클리닉, 비만클리닉, 치과예요.
        source: https://health4u.snu.ac.kr/operation/contact/_/view.do
        checked: 2026-11-02
      - text: 진료 당일 신분증을 들고 329호에서 접수해요. 예약 없이도 진료받을 수 있어요.
        source: https://health4u.snu.ac.kr/operation/useProcedure/_/view.do
        checked: 2026-11-02
      - text: 예약은 선택이에요. 진료일 하루 전까지 홈페이지에서 온라인으로 예약해요. 전화로는 예약할 수 없어요.
        source: https://health4u.snu.ac.kr/operation/useProcedure/_/view.do
        checked: 2026-11-02
      - text: 정신건강의학과는 예약해야 진료받을 수 있어요. 방문하거나 02-880-5347로 전화해 예약해요.
        source: https://health4u.snu.ac.kr/operation/useProcedure/_/view.do
        checked: 2026-11-02
      - text: 건강보험 가입자는 진찰료 없이 검사·처치 비용 일부만 내요. 미가입자는 할인된 진찰료와 검사·처치 비용 일부를 내요.
        source: https://health4u.snu.ac.kr/noti/faq/_/list.do
        checked: 2026-11-02
      - text: 대표전화는 02-880-5338이에요.
        source: https://health4u.snu.ac.kr/operation/guide/_/view.do
        checked: 2026-11-02

  - key: art-museum
    order: 5
    title: 서울대 미술관/파워플랜트 관람
    brief: 캠퍼스 안의 미술관과 파워플랜트에서 전시를 봐요.
    body:
      - 서울대학교 미술관(151동)과 파워플랜트(68동)에서 전시를 볼 수 있어요. 지금 하는 전시는 각 홈페이지에서 확인해 보세요.
    condition: 미술관이나 파워플랜트 전시 관람하기
    completion:
      kind: button
    completionMessage: 전시는 즐거우셨나요? 캠퍼스 곳곳의 문화 공간을 자주 찾아 보세요!
    places:
      - place: '151'
      # 파워플랜트, not 제2파워플랜트 (330).
      - place: '68'
    links:
      - label: 서울대학교 미술관
        url: http://www.snumoa.org/
      - label: 파워플랜트
        url: https://culture.snu.ac.kr/event/powerplant365/
