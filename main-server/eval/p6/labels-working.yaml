# The blind draft as the drafter wrote it (2026-11-02), kept for the record. The labels that run are the cases' `expect`,
# after the PM's rulings in labels-notes.md, which changed several of the answers below.

# P6 labels, drafted blind from rules.md, world.yaml, the catalogue, tutorial.yaml, spec.md and the cases only.
# One `expect` block per case id, in rules.md section 16's form, ready to paste under the case.
# Conventions:
# - A field left out of a card entry is not checked. `useDesc: null` means the card must leave it unset.
# - `{ kind: library, max: 0 }` means no library card at all; `{ kind: library, action: X, max: 0 }` means no card of
#   that action.
# - Section 17 decisions used here: a bare 1–6시 is the afternoon (17.1); capacity narrows the candidates (17.2);
#   "지금 7층 자리 있어?" gives seats cards (17.3, the spec); unmapped purposes are left out (17.4); a named room goes in
#   `equipment` (17.7). See p6-labels-review.md.
# - `spaceIn` (p6-common-seats-now only) is a proposed extension: the card's space is one of the listed ids.

