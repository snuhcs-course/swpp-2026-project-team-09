# Group rooms (P06 spec, "The P6 eval suite"): resolveFriend for each Friend, then a book card with companions; below
# GR_MIN; above GR_MAX; two Friends of one name; the held lunch Quest; 9 people for a 10인실 and a 20인실 (G201)
# request. Each `expect` was drafted blind and settled by the PM's rulings of 2026-11-02 (labels-notes.md). A headcount
# refusal goes through proposeLibraryBooking and calls nothing else (ruling 16); the same-name ASK may call only
# resolveFriend.

- id: p6-group-rooms-companions
  category: p6-group-rooms
  world: p6
  repeat: 3
  turns:
    - user: 모레 오후 2시부터 2시간 2층 6인실 잡아줘. 민수, 지은, 하람, 유진이랑 과제할 거야
  expect:
    actions: [TOOL]
    cards:
      - kind: library
        action: book
        space: 2F-group-6
        conditions:
          date: '2026-11-06'
          start: '14:00'
          minutes: 120
          useDesc: 과제
          companions: [이민수, 김지은, 정하람, 최유진]
    text:
      mentions:
        - [동의 요청, 동의]
      absent:
        - 예약되었어요
        - 예약했어요
        - 초대했어요
        - 초대했
        - '2026-000'

