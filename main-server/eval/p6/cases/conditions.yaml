# Booking conditions (P06 spec, "The P6 eval suite"): proposeLibraryBooking with the right date, start, minutes or end,
# seat, equipment and useDesc. Times in several forms, a missing time, useDesc inferable and not, a named seat, "모니터
# 있는 스터디룸" → ASK, "공강에" with an ambiguous space → ASK for the space, and with one space → findLibraryFreeSlots
# and an ASK listing the slots. Each `expect` was drafted blind and settled by the PM's rulings of 2026-11-02
# (labels-notes.md).

# The spec's own example. "7층 열람실" fits the four 7층 seat spaces: an ASK (ruling 1).
- id: p6-conditions-hours-from
  category: p6-conditions
  world: p6
  repeat: 3
  turns:
    - user: 7층 열람실 5시부터 두 시간 잡아줘
  expect:
    actions: [ASK]
    tools:
      forbidden: '*'
    cards:
      - { kind: library, max: 0 }
    text:
      mentions:
        - [7A 열람실 1 구역, 7A 1구역, 7A 1 구역]
        - [7A 열람실 2 구역, 7A 2구역, 7A 2 구역]
        - [7B 노트북존, 7B]
        - [노트북존]

