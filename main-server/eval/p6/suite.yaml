# The P6 suite (P06 spec, "The P6 eval suite"; ticket 06): 관정 booking and the tutorial in the Assistant. Its cases are
# under cases/, its world is world.yaml and its rules rules.md. `pnpm eval --world p6` runs it: every case has
# `repeat: 3`, so that a pass rate is the mean of the 3 runs.
#
# Labelled and frozen at C0 (tag eval-freeze-iter3-p6, below). Each case's `expect` was drafted blind by an agent that
# read only rules.md, world.yaml, the catalogue, content/tutorial.yaml, the spec and the questions, and then settled by
# the PM's rulings of 2026-11-02 (labels-notes.md): one right answer per case, anything ambiguous an ASK. The clinic's
# facts come from health4u.snu.ac.kr. The thresholds below are the spec's proposals, frozen at C0: everything (cases,
# world, rules, labels, thresholds) is committed and tagged C0 before R0. A value changed after a result is entered with
# `revises:` and `reason:`, as P5's are.
#
# The tutorial is the suite's own copy, tutorial.yaml beside this file, frozen with C0; a run of the p6 world serves it in
# the place of content/tutorial.yaml (WORLD_TUTORIAL_FILES in eval/cases.ts). A new tutorial quest ships with at least
# two P6 cases: one asking a fact in its content, and one asking something the content lacks, answered with the link or
# 확인되지 않아요. The copy is updated, together with any label tied to the number of quests (such as
# p6-tutorial-progress), only when the suite moves to a new version (C1). That change is entered with `revises:` and
# `reason:`, and the new version gets its own run.
world: p6

cases:
  p6-spaces: 14
  p6-conditions: 15
  p6-refusals: 10
  p6-group-rooms: 7
  p6-bookings: 5
  p6-tutorial: 8
  p6-common: 5

# The case subsets the metrics are reported on.
subsets:
  # M1's alias subset: site aliases, proposed aliases and purposes.
  siteAliases: [p6-spaces-alias-studio, p6-spaces-alias-vr, p6-spaces-alias-whiteboard, p6-spaces-alias-7b-notebook]
  # The four alias cases: proposed aliases and purposes, the meaning labels the owner reviews and the second labeller
  # labels.
  proposedAliases: [p6-spaces-purpose-movie, p6-spaces-alias-quiet, p6-spaces-purpose-livestream, p6-spaces-alias-imac]
  # M3, by kind.
  refusalUnsupported: [p6-refusals-main-library, p6-refusals-other-floor, p6-refusals-other-library]
  refusalNotOnline: [p6-refusals-g202, p6-refusals-info-search, p6-refusals-carrel, p6-spaces-purpose-movie]
  refusalOutOfWindow: [p6-refusals-seat-tomorrow, p6-refusals-room-in-four-days, p6-refusals-late-and-long]
  refusalNotEligible: [p6-refusals-grad-room-undergraduate]
  # The 8-people party limit.
  partyLimit: [p6-group-rooms-nine-people, p6-group-rooms-g201]

# P19 cases whose expected answer this work changes, not edited, reported apart in the regression. Each is listed with
# the P6 case that holds the new answer.
superseded:
  - { case: out-of-scope-library-seats, heldBy: p6-common-central-library-seats }

score:
  # A case passes when all its assertions hold. The mean of the 3 runs.
  runs: 3

# The spec's proposals, to freeze at C0. `declared` is set at the freeze.
thresholds:
  - { id: M1, metric: M1, measure: space resolution accuracy, comparator: '>=', value: 0.9, declared: 2026-11-02 }
  - { id: M1-aliases, metric: M1, measure: alias subset, comparator: '>=', value: 0.8, declared: 2026-11-02 }
  - { id: M2, metric: M2, measure: each field's accuracy, comparator: '>=', value: 0.9, declared: 2026-11-02 }
  - { id: M2-useDesc, metric: M2, measure: useDesc accuracy, comparator: '>=', value: 0.8, declared: 2026-11-02 }
  - {
      id: M3,
      metric: M3,
      measure: each refusal kind's share of runs,
      comparator: '>=',
      value: 0.9,
      declared: 2026-11-02,
    }
  - {
      id: M4,
      metric: M4,
      measure: book,
      cancel or return cards in replies not labelled that action,
      over all runs (a hard gate),
      comparator: '=',
      value: 0,
      declared: 2026-11-02,
    }
  - { id: M5, metric: M5, measure: grounded tutorial replies, comparator: '>=', value: 0.9, declared: 2026-11-02 }
  - { id: overall, metric: overall, measure: cases passed, comparator: '>=', value: 0.8, declared: 2026-11-02 }
  - {
      id: per-category,
      metric: overall,
      measure: each category's cases passed,
      comparator: '>=',
      value: 0.7,
      declared: 2026-11-02,
    }

labels:
  # A separate agent that read only rules.md, world.yaml, the catalogue, content/tutorial.yaml, the spec and the
  # questions, never the prompt, tools or code.
  draftedBy: claude-opus-5-5
  draftedOn: '2026-11-02'
  # The PM's rulings on the draft, three rounds on one day (labels-notes.md). The PR reviewer checks the labels.
  ruledBy: AhnJinYoung
  ruledOn: '2026-11-02'
  # The label review on #177 came from 함재현's GitHub account running an agent (Claude), not a person's read of every
  # label. Its points were applied (labels-notes.md, rulings 16–21).
  reviewedBy: Jaehyun0320 (an agent, Claude, run from 함재현's account)
  reviewedOn: '2026-11-02'
  # Optional: a teammate who labels about 10 cases from scratch.
  secondLabeller: null
  overlap: []
  agreement: null
  # What is still open.
  # The clinic's facts (health4u.snu.ac.kr, 2026-11-02) are in content/tutorial.yaml since #180.
  openForReview: []

