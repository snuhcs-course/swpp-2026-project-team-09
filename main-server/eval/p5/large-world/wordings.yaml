# How posts name each activity in the large world (P05 ticket 02b). A model drafted this list, so a person checks a
# sample of it: the sample and its result are in ../large-world-v1/wordings-check.json. Each title means its activity
# and no other, so that a Quest's activity is what a person would read from its title. No title uses a word that may
# cover several activities (전시, 공연, 운동), since the rules count such a word as all of them (rules.md, section 8).
#
# - hours: when its Quests start. day 09-20, evening 17-23, morning 06-10, late 21-24, any 07-23.
# - weight: how many of the generated Quests it takes, against the others.
# - quest: the titles of Quests, with the misspelt ones apart. event: the titles of Global Events, {host} being a name
#   of `hosts`. An activity without `event` has no Global Event.
# - typos: only where no case of E7's subsets depends on it: a post no word finds is cut from a window of more than 30
#   candidates (P05 spec, "Further Notes"), and those subsets ask a server recall of 1.0. traps.ts adds single misspelt
#   posts of the others.

