# The P05 suite (P05 spec, "The P05 eval suite"): evaluations C and D, committed before any run. Its cases are under
# cases/, its world is world.yaml and its rules rules.md. `pnpm eval --world p5` runs it: every case has `repeat: 3`.
# The values are the metrics document's, confirmed by the P05 owner on 2026-10-31. To change one, leave it here and add
# an entry with `revises:` and `reason:`; a value chosen after seeing a result counts as undeclared.
world: p5

# k/n counts runs: a case repeated 3 times counts 3. So J3a's 2/3 is at least 6 of its 9 runs, and E5's 4/6 is at least
# 12 of its 18 (P05 owner, 2026-10-31).
unit: runs

# R0, the first official run: the code before any chat change of P05, on a clean descendant of C0. Later runs change one
# thing each: R1 ticket 10, R2 ticket 11, R3 ticket 12.
naive: 'The chat as it is before this work.'

whenAFloorIsMissed: "That metric's improvement is not claimed, and the failure analysis says why (metrics document, 4.1)."

# A subset of five cases moves by 20% with one case. An improvement smaller than the exact McNemar test can tell (6, 8
# or 10 fixed with 0, 1 or 2 turned the other way) is reported as a direction only (metrics document, 4.4).
smallSamples: 'Each subset has at least five cases, and E has six. One case of five is 20%; a smaller improvement is a direction only.'

