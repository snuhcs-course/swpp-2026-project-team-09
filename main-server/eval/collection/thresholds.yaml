# Thresholds of evaluations A and B, committed with the sets before any run (metrics document, 2 and 4.1). The values are
# the metrics document's, confirmed by the P05 owner on 2026-10-31. To change one, leave it here and add an entry with
# `revises:` and `reason:`; a value chosen after seeing a result counts as undeclared.
sets:
  a: set-a.yaml
  b: set-b.yaml

# R0, the first official run of each evaluation, on a clean descendant of C0.
naive:
  a: "The collection rules alone. Every post of the set is a Draft the rules did not publish, so C1's baseline is 0."
  b: 'Equal starts with title similarity, and nothing else.'

whenAFloorIsMissed:
  every: "That metric's improvement is not claimed, and the failure analysis says why."
  stopsAutomaticPublication: [C2, C3, D1]
  stops: 'Automatic publication is turned off in Production by its setting, and the record says so.'

thresholds:
  # Evaluation A. Scored on the held-out part, per session unless it says otherwise. C1 and C2 are always reported as a
  # pair, with k/n.
  - id: c1.floor
    metric: C1
    measure: 'Sessions published as the answer says ÷ sessions the answer says may be published'
    kind: floor
    comparator: '>='
    value: 0.25
    declared: 2026-10-31
  - id: c1.target
    metric: C1
    measure: 'Sessions published as the answer says ÷ sessions the answer says may be published'
    kind: target
    comparator: '>='
    value: 0.60
    declared: 2026-10-31
  - id: c2.floor
    metric: C2
    measure: 'Sessions published wrong ÷ sessions published. Wrong when the start, the Place or a given end differs'
    kind: floor
    comparator: '<='
    value: 0.03333333333333333
    declared: 2026-10-31
    note: '1/30, as the metrics document writes it. Reported as k/n.'
  - id: c2.target
    metric: C2
    measure: 'Sessions published wrong ÷ sessions published. Wrong when the start, the Place or a given end differs'
    kind: target
    comparator: '='
    value: 0
    declared: 2026-10-31
  - id: c3.floor
