# Deploys a Release to Production: a pushed tag snunow/<target>/YY.MM.DD-N deploys its target at the tag's commit once
# CI has passed on it: one server, the app's bundle to EAS Update, or all five servers and then the app. Run by hand on
# a Release's tag, it deploys that Release again. The steps' logic is in .github/release/release.sh.
name: Release
run-name: ${{ github.ref_name }}

on:
  push:
    tags:
      - snunow/**
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  name:
    name: name check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      servers: ${{ steps.check.outputs.servers }}
      app: ${{ steps.check.outputs.app }}
      image-tag: ${{ steps.check.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/release
      - id: check
        run: .github/release/release.sh check-name "$GITHUB_REF" | tee -a "$GITHUB_OUTPUT"

  release:
    name: release ${{ matrix.server }}
    needs: name
    if: needs.name.outputs.servers != '[]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.name.outputs.servers) }}
    # The gate runs inside the group too, so a newer Release of the server cancels an older one wherever it is, and an
    # older one still waiting for CI never starts after it.
    concurrency:
      group: release-${{ matrix.server }}
      cancel-in-progress: true
    env:
      SERVER: ${{ matrix.server }}
      IMAGE_TAG: ${{ needs.name.outputs.image-tag }}
      REGISTRY: ${{ vars.PRODUCTION_ECR_REGISTRY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: echo "COMMIT=$(git rev-parse HEAD)" >>"$GITHUB_ENV"
      - name: Wait for CI on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/release/release.sh gate "$GITHUB_REPOSITORY" "$COMMIT" "$GITHUB_REF_NAME"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.PRODUCTION_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push the image
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY: ${{ vars.NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY }}
        run: .github/release/release.sh push-image "$REGISTRY" "$SERVER" "$COMMIT" "$IMAGE_TAG"
      # The role's permission names the path without a trailing slash, and the request must name it the same way.
      - name: Write the secrets from Parameter Store
        env:
          DATABASE_ENDPOINT: ${{ vars.PRODUCTION_DATABASE_ENDPOINT }}
        run: |
          aws ssm get-parameters-by-path --path /snunow/production --with-decryption --output json |
            .github/release/release.sh write-secrets infra/production/k8s/parts/shared/secrets "$DATABASE_ENDPOINT"
      # The runner's own kubectl is two minor versions behind the cluster, outside kubectl's supported skew of one.
      - name: Install kubectl 1.37
        run: |
          curl --fail --silent --show-error --location --remote-name https://dl.k8s.io/release/v1.37.1/bin/linux/arm64/kubectl
          curl --fail --silent --show-error --location --remote-name https://dl.k8s.io/release/v1.37.1/bin/linux/arm64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install --mode 0755 kubectl /usr/local/bin/kubectl
          rm kubectl kubectl.sha256
          kubectl version --client
      - name: Deploy
        env:
          CLUSTER_NAME: ${{ vars.PRODUCTION_CLUSTER_NAME }}
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME"
          .github/release/release.sh deploy "$REGISTRY" "$SERVER" "$COMMIT"
      - name: Delete the settings and secrets no pod uses
        run: .github/release/release.sh clean

  # Publishes the commit's JavaScript bundle to EAS Update for Android and iOS. For `all` it starts only once every
  # server has rolled out, so that a bundle never calls a server that is not there yet; a failed or cancelled server
  # job stops it. Every build setting comes from a repository variable and must equal the native build's (see
  # infra/production/README.md § The Production APK): some are baked into the bundle, others change the fingerprint.
  app:
    name: release app
    needs: [name, release]
    if: >-
      !cancelled() && needs.name.result == 'success' && needs.name.outputs.app == 'true' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Not cancelled by a newer arrival: an `all` Release's app job arrives only when its servers finish, so arrival
    # order is not push order, and cancelling would drop a newer bundle. The later arrival waits and its ordering check
    # skips it. GitHub keeps one pending job per group, so a third arrival replaces the pending one.
    concurrency:
      group: release-app
      cancel-in-progress: false
    env:
      EXPO_PUBLIC_MAIN_SERVER_URL: ${{ vars.PRODUCTION_APP_MAIN_SERVER_URL }}
      EXPO_PUBLIC_SOCKET_SERVER_URL: ${{ vars.PRODUCTION_APP_SOCKET_SERVER_URL }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.PRODUCTION_APP_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.PRODUCTION_APP_GOOGLE_IOS_CLIENT_ID }}
      GOOGLE_IOS_URL_SCHEME: ${{ vars.PRODUCTION_APP_GOOGLE_IOS_URL_SCHEME }}
      INVITE_LINK_HOST: ${{ vars.PRODUCTION_APP_INVITE_LINK_HOST }}
      APP_VERSION_URL: https://github.com/${{ github.repository }}/releases/download/app-version/app-version.json
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: echo "COMMIT=$(git rev-parse HEAD)" >>"$GITHUB_ENV"
      - name: Wait for CI on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/release/release.sh gate "$GITHUB_REPOSITORY" "$COMMIT" "$GITHUB_REF_NAME"
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          working-directory: mobile
          node-version-file: ../.nvmrc
          cache: true
          require-lockfile: true
      # An empty variable would give another fingerprint, or a bundle that calls nowhere.
      - name: Check the build settings
        run: |
          for name in EXPO_PUBLIC_MAIN_SERVER_URL EXPO_PUBLIC_SOCKET_SERVER_URL EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID \
            EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID GOOGLE_IOS_URL_SCHEME INVITE_LINK_HOST; do
            [[ -n "${!name}" ]] || { echo "app: the repository variable for $name is not set" >&2 && exit 1; }
          done
      # An older Release whose server jobs finished late must not put its bundle over a newer one. A run by hand is a
      # rollback and always publishes.
      - name: Check that no newer commit's bundle is published
        id: order
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          group=$(npx --yes eas-cli@26.0.0 update:list --branch production --limit 1 --json --non-interactive |
            jq -r '.currentPage[0].group // empty')
          published='' compared=''
          if [[ -n "$group" ]]; then
            published=$(npx --yes eas-cli@26.0.0 update:view "$group" --json | jq -r '.[0].gitCommitHash // empty')
          fi
          if [[ -n "$published" ]]; then
            echo "app: the latest update, group $group, is of commit $published"
            compared=$(gh api "repos/$GITHUB_REPOSITORY/compare/$published...$COMMIT" --jq .status) || {
              echo "::warning::The published update's commit $published could not be compared with $COMMIT."
              compared=''
            }
          fi
          order=$(../.github/release/release.sh app-order "$GITHUB_EVENT_NAME" "$compared")
          echo "order=$order" >>"$GITHUB_OUTPUT"
          if [[ "$order" == skip ]]; then
            echo "::notice::Not published: the bundle of $published, newer than $COMMIT, is already published."
            {
              echo "### Not published"
              echo
              echo "The bundle of $published, a newer commit than this Release's $COMMIT, is already published. A"
              echo "Release run by hand publishes regardless (infra/production/README.md § The app's bundle)."
            } >>"$GITHUB_STEP_SUMMARY"
          fi
      # The fingerprint is the app's runtime version, which EAS Update gives to installed apps only when it is their own.
      - name: Decide whether the bundle fits the latest native build
        id: decision
        if: steps.order.outputs.order == 'publish'
        working-directory: mobile
        run: |
          android=$(npx expo-updates fingerprint:generate --platform android | jq -er .hash)
          ios=$(npx expo-updates fingerprint:generate --platform ios | jq -er .hash)
          version=$(jq -r .expo.version app.json)
          echo "app: version $version, fingerprints android $android, ios $ios"
          echo "android=$android" >>"$GITHUB_OUTPUT"
          echo "ios=$ios" >>"$GITHUB_OUTPUT"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/app-version.json" "$APP_VERSION_URL" ||
            echo "app: $APP_VERSION_URL could not be downloaded"
          verdict=$(../.github/release/release.sh app-decision "$android" "$ios" "$version" \
            "$RUNNER_TEMP/app-version.json")
          if [[ "$verdict" == publish-needs-build ]]; then
            echo "::notice::A new APK and iOS build are needed: the app's native part changed, and version is $version."
            {
              echo "### A new APK and iOS build are needed"
              echo
              echo "The app's native part changed since the latest native build, and \`version\` is $version. This"
              echo "update reaches only a native build of this commit's native part: make a native Release"
              echo "(infra/production/README.md § The Production APK)."
            } >>"$GITHUB_STEP_SUMMARY"
          fi
      # `--json` prints the published updates to stdout and the progress to the log. Each platform's runtime version
      # must be the fingerprint decided on above.
      - name: Publish the bundle
        if: steps.order.outputs.order == 'publish'
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_RELEASE_TAG: ${{ github.ref_name }}
          EXPO_PUBLIC_RELEASE_COMMIT: ${{ env.COMMIT }}
          ANDROID: ${{ steps.decision.outputs.android }}
          IOS: ${{ steps.decision.outputs.ios }}
        run: |
          npx --yes eas-cli@26.0.0 update --channel production --environment production --platform all \
            --non-interactive --message "$GITHUB_REF_NAME" --json | tee "$RUNNER_TEMP/updates.json"
          ../.github/release/release.sh check-published "$ANDROID" "$IOS" <"$RUNNER_TEMP/updates.json"
