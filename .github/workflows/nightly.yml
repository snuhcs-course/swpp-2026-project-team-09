# Starts CI at the nightly level (.github/ci/changes.sh), with the app's integration tests, on the newest commit of the
# newest iteration Main, every night at 03:00 KST. GitHub fires a schedule only from the default branch's copy of this
# file, so it starts nothing until `main` holds it; until then the same run is started by hand (README.md § Running the
# tests). A run started with the workflow's token sends GitHub's failure mail to nobody: a red one is found by its name,
# "Nightly level on <line>/Main", in CI's list of runs.
name: Nightly

on:
  schedule:
    - cron: '0 18 * * *'

permissions:
  actions: write
  contents: read

jobs:
  start:
    name: start
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start CI at the nightly level on the newest iteration Main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' |
            { grep -E '^[0-9]+\.[0-9]+/Main$' || true; } | sort -V | tail -n 1)
          if [[ -z $main ]]; then
            echo "::error::No <line>/Main branch was found"
            exit 1
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$main"
          echo "Started CI at the nightly level on $main." >>"$GITHUB_STEP_SUMMARY"
