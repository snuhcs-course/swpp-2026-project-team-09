name: CI

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - main-server
          - socket-server
          - worker-server
          - match-server
          - admin
          - mobile
          # Starts the four servers with Docker and runs the demo flows across them.
          - flow-tests
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          working-directory: ${{ matrix.project }}
          node-version-file: ../.nvmrc
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  # The Dev Server's shell scripts and their tests. The deploy script does not wait for this check.
  deploy-scripts:
    name: deploy-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends bats shellcheck jq
      - run: find infra/deploy \( -name '*.sh' -o -name '*.bats' \) -print0 | xargs -0 shellcheck
      - run: bats --recursive infra/deploy
