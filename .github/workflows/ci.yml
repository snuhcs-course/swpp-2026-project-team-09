name: CI

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - main-server
          - socket-server
          - worker-server
          - match-server
          - admin
          - mobile
          # Starts the four servers with Docker and runs the demo flows across them.
          - flow-tests
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          working-directory: ${{ matrix.project }}
          node-version-file: ../.nvmrc
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  # The Dev Server's shell scripts and their tests. The deploy script does not wait for this check.
  deploy-scripts:
    name: deploy-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends bats shellcheck jq
      - run: find infra/deploy \( -name '*.sh' -o -name '*.bats' \) -print0 | xargs -0 shellcheck
      - run: bats --recursive infra/deploy

  # Production's Terraform, checked without a backend or AWS credentials.
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/production/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate

  # Production's manifests render as a Release would apply them, with stand-ins for the secrets folder that the Release
  # workflow writes.
  manifests:
    name: manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Write stand-in secrets
        working-directory: infra/production/k8s
        run: |
          mkdir secrets
          cat >secrets/secrets.env <<'EOF'
          MAIN_DATABASE_URL=postgresql://main:stand-in@database.example:5432/main?sslmode=verify-full
          MATCH_DATABASE_URL=postgresql://match:stand-in@database.example:5432/match?sslmode=verify-full
          WORKER_TOKEN=stand-in
          MATCH_SERVER_TOKEN=stand-in
          KAKAO_REST_API_KEY=stand-in
          OPENROUTER_API_KEY=stand-in
          INITIAL_ADMINISTRATOR_EMAILS=stand-in@example.com
          EOF
          echo stand-in >secrets/access-token-private-key.pem
          echo stand-in >secrets/access-token-public-key.pem
      - run: kubectl kustomize infra/production/k8s
