name: CI
# A run started by hand or by the nightly (.github/workflows/nightly.yml) is named for its level, so that a red one is
# easy to find among the pushes' runs; every other run keeps GitHub's own name.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Nightly level on {0}', github.ref_name) || '' }}

# Three levels (.github/ci/changes.sh): a working branch's push and the merge queue run the basic level, a push to a
# Main, main or development and a tag's push the full level, which leaves out only the app's integration tests
# (mobile-tests), and a run started by hand or by the nightly the nightly level, which runs everything.
on:
  push:
    # A merge queue's branches are checked by their merge_group run.
    branches-ignore: ['gh-readonly-queue/**']
    # Named because a branch filter alone would leave tags out, and the Release gate waits for the tag's run.
    tags: ['**']
  merge_group:
  workflow_dispatch:

concurrency:
  # A run at the nightly level has a group of its own, so that it neither waits for nor holds up a Main's pushes.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'nightly-' || '' }}${{ github.ref }}
  # A Main's run in progress is not cancelled, since a job that skips on a branch or in the merge queue leans on its
  # Main's last full run. A newer push's run replaces one still waiting, so a Main has one full run at a time, on its
  # newest commit, which covers every commit merged before it. The same holds for a Main's nightly-level runs.
  cancel-in-progress: ${{ !endsWith(github.ref, '/Main') }}

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - main-server
          - socket-server
          - worker-server
          - admin
          - mobile
          # Starts the three servers with Docker and runs the demo flows across them.
          - flow-tests
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      # Every branch's history without file contents, then the script that says whether the branch's changes reach this
      # job: each later step runs unless it said run=false.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: changes
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: .github/ci/changes.sh ${{ matrix.project }}
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        if: steps.changes.outputs.run != 'false'
        with:
          working-directory: ${{ matrix.project }}
          node-version-file: ../.nvmrc
          cache: true
          require-lockfile: true
      - run: pnpm lint
        if: steps.changes.outputs.run != 'false'
      - run: pnpm format:check
        if: steps.changes.outputs.run != 'false'
      - run: pnpm typecheck
        if: steps.changes.outputs.run != 'false'
      - run: pnpm test
        if: matrix.project != 'mobile' && steps.changes.outputs.run != 'false' && steps.changes.outputs.tests != 'unit'
      # A working branch's push and the merge queue run only the unit tests; the full and nightly levels run every
      # test. The app's unit tests run here at every level, and its integration tests in mobile-tests at the nightly
      # level only.
      - run: pnpm test:unit
        if: >-
          matrix.project != 'flow-tests' && steps.changes.outputs.run != 'false' &&
          (steps.changes.outputs.tests == 'unit' || matrix.project == 'mobile')

  # The app's integration tests, at the nightly level only: they take over twenty minutes even split across four
  # runners, packed by each file's measured seconds (.github/ci/app-test-sequencer.cjs). Each keeps Jest's transform
  # cache for the next runs on its branch. At the basic and full levels the jobs run nothing and still report success,
  # since the Iteration Main's ruleset requires them by name; the mobile job runs the app's unit tests at every level.
  mobile-tests:
    name: mobile-tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: changes
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: .github/ci/changes.sh mobile-tests
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        if: steps.changes.outputs.run != 'false' && steps.changes.outputs.tests != 'unit'
        with:
          working-directory: mobile
          node-version-file: ../.nvmrc
          cache: true
          require-lockfile: true
      - uses: actions/cache@v6
        if: steps.changes.outputs.run != 'false' && steps.changes.outputs.tests != 'unit'
        with:
          path: ${{ runner.temp }}/jest
          key: mobile-jest-${{ matrix.shard }}-${{ hashFiles('mobile/pnpm-lock.yaml') }}
      - run: >-
          pnpm test:integration --shard=${{ matrix.shard }}/${{ strategy.job-total }} --cacheDirectory=${{ runner.temp }}/jest
          --testSequencer=${{ github.workspace }}/.github/ci/app-test-sequencer.cjs
        if: steps.changes.outputs.run != 'false' && steps.changes.outputs.tests != 'unit'

  # The app's fingerprints under Production's build settings, against the latest native build's in app-version.json:
  # the Release workflow's own decision, so that a native change without a raised `version` fails here and not at its
  # Release. A commit from before the latest native Release passes with a notice; its app Release would still refuse to
  # publish. The Kakao key changes no fingerprint and is not needed.
  app-fingerprint:
    name: app-fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      EXPO_PUBLIC_MAIN_SERVER_URL: ${{ vars.PRODUCTION_APP_MAIN_SERVER_URL }}
      EXPO_PUBLIC_SOCKET_SERVER_URL: ${{ vars.PRODUCTION_APP_SOCKET_SERVER_URL }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.PRODUCTION_APP_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.PRODUCTION_APP_GOOGLE_IOS_CLIENT_ID }}
      GOOGLE_IOS_URL_SCHEME: ${{ vars.PRODUCTION_APP_GOOGLE_IOS_URL_SCHEME }}
      INVITE_LINK_HOST: ${{ vars.PRODUCTION_APP_INVITE_LINK_HOST }}
      APP_VERSION_URL: https://github.com/${{ github.repository }}/releases/download/app-version/app-version.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: changes
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: .github/ci/changes.sh app-fingerprint
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        if: steps.changes.outputs.run != 'false'
        with:
          working-directory: mobile
          node-version-file: ../.nvmrc
          cache: true
          require-lockfile: true
      - name: Decide as the Release workflow would
        if: steps.changes.outputs.run != 'false'
        run: |
          outputs=$(.github/release/release.sh fingerprint-and-decide "$APP_VERSION_URL" \
            "$RUNNER_TEMP/app-version.json" ci)
          case $(sed -n 's/^verdict=//p' <<<"$outputs") in
            publish-needs-build)
              echo "::notice::The app's native part changed and version was raised: the next app Release's tag" \
                "builds the APK in CI (infra/production/README.md § The Production APK)."
              ;;
            behind)
              echo "::notice::This commit is behind the latest native Release (latest" \
                "$(jq -r .latest "$RUNNER_TEMP/app-version.json")): rebase onto the main line."
              ;;
          esac

  # The Dev Server's shell scripts and their tests. The deploy script does not wait for this check.
  deploy-scripts:
    name: deploy-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: changes
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: .github/ci/changes.sh deploy-scripts
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends bats shellcheck jq
        if: steps.changes.outputs.run != 'false'
      - run: find infra/deploy \( -name '*.sh' -o -name '*.bats' \) -print0 | xargs -0 shellcheck
        if: steps.changes.outputs.run != 'false'
      - run: bats --recursive infra/deploy
        if: steps.changes.outputs.run != 'false'

  # The Release workflow's script and its tests, which reach neither GitHub nor AWS.
  release-script:
    name: release-script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: changes
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: .github/ci/changes.sh release-script
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends bats shellcheck jq
        if: steps.changes.outputs.run != 'false'
      - run: find .github/release .github/ci \( -name '*.sh' -o -name '*.bats' \) -print0 | xargs -0 shellcheck
        if: steps.changes.outputs.run != 'false'
      - run: bats --recursive .github/release .github/ci
        if: steps.changes.outputs.run != 'false'

  # Production's Terraform, checked without a backend or AWS credentials, and the Fluent Bit pipeline that its Helm
  # release reads. The pipeline's test starts Fluent Bit in Docker, but runs at every level, so that a broken filter is
  # caught in review.
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/production/terraform
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: changes
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: .github/ci/changes.sh terraform
      - uses: hashicorp/setup-terraform@v4
        if: steps.changes.outputs.run != 'false'
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -check
        if: steps.changes.outputs.run != 'false'
      - run: terraform init -backend=false -input=false -lockfile=readonly
        if: steps.changes.outputs.run != 'false'
      - run: terraform validate
        if: steps.changes.outputs.run != 'false'
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends bats shellcheck jq
        if: steps.changes.outputs.run != 'false'
      - run: find fluent-bit-pipeline \( -name '*.sh' -o -name '*.bats' \) -print0 | xargs -0 shellcheck
        if: steps.changes.outputs.run != 'false'
      - run: bats --recursive fluent-bit-pipeline
        if: steps.changes.outputs.run != 'false'

  # Production's manifests: each target renders with stand-ins for the secrets that the Release workflow writes, and
  # holds the objects that a Release of it applies.
  manifests:
    name: manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: changes
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: .github/ci/changes.sh manifests
      - run: infra/production/k8s/test/targets.sh
        if: steps.changes.outputs.run != 'false'
