# 관정관 (libNo 1) space catalogue for request-to-room mapping.
# Built read-only from k-rsv.snu.ac.kr/NEW_SNU_BOOKING on 2026-11-01:
#   getSectorList, getRoomList (2026-11-02), getSeatInfo (json/seatinfo_<seatNo>.json),
#   roomForm_<sectorNo>.html 유의사항/사용용도/서약서, page_<room>_<sector>.html, FINDINGS.md.
# purpose: one sentence drawn from site text (DEVICE_COMMENT, 유의사항); where the site says
#   nothing, purpose_source: proposed.
# aliases: source: site = the site's own wording; source: proposed = inferred.
# implemented: true = inside the user's scope (2/4층 그룹스터디룸, 6층 미디어플렉스 bookable rooms,
#   7/8층 열람실 incl. 노트북존 and 대학원 열람실).
# The /pc/guide/list page only explains how to use the web booking UI (01 예약하기, 02 그룹스터디룸 예약,
#   03 나의 예약현황); it describes no space and links to no further guide content.

common:
  group_study_room:
    duration: "0:30–3:00 in 30-min steps, no extension"
    hours: "09:00–23:00 (getRoomList OPENTIME/CLOSETIME; '0000' = closed that day)"
    booking_ahead: "today + 3 days (DAY_FROM 0, DAY_TO 3)"
    useDesc: [강의, 과제, 동아리활동, 연구, 취업, 기타]
    needs_pledge: false
    eligibility: >-
      Applicant plus companions by name + 학번 (getUserCheck), at least GR_MIN people including the applicant.
      Site notes: S-CARD required to enter (register at scard.snu.ac.kr); using another person's 학번 → cancellation
      and 30-day ban (guide page).
    rules: "Not entered within 1 h → cancelled; 3 no-shows in 7 days → 3-day ban (FINDINGS)."
  media_room:
    duration: "0:30–3:00 (XR 0:30–2:00, Creative Media Studio 0:30–4:00)"
    booking_ahead: "today + 3 days"
    needs_pledge: true
    pledge_text: >-
      퇴실 시 기기 고장, PC 비정상 프로그램 설치 등의 문제 발생 시 변상 및 원상 복구 규정에 대해 동의 … 민, 형사상의 모든 책임을 본인이 지고 …
    eligibility: "Leave an ID card (신분증) at the 6층 desk / 관정미디어플렉스 at the booked time. Users who may damage equipment can be refused."
    saturday_hours: unknown
  reading_room:
    unit: seat
    duration: "0:30–6:00 in 30-min steps, extension possible"
    hours: "07:00–23:00"
    booking_ahead: "today only"
    useDesc: null          # seat bookings have no 사용용도
    needs_pledge: false
    capacity: null         # one person per seat; no GR_MIN/GR_MAX
    rules: >-
      Confirm at the 좌석배정기 (kiosk) within 30 min or the seat is auto-returned (site: "예약 후 좌석배정기에서 확인을 해야 정상 이용이 가능합니다");
      5 no-shows/unreturned in a month → 10-day ban (FINDINGS). S-CARD required to enter.
    seat_info: "getSeatInfo returns successYN N '좌석 추가 정보가 존재하지 않습니다.' for every reading-room seat sampled — no per-seat equipment text."

