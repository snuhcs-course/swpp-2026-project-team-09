apiVersion: apps/v1
kind: Deployment
metadata:
  name: socket-server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: socket-server
  template:
    metadata:
      labels:
        app: socket-server
    spec:
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: socket-server
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: socket-server
          image: socket-server
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: '3001'
            - name: REDIS_HOST
              valueFrom: { configMapKeyRef: { name: settings, key: REDIS_HOST } }
            - name: REDIS_PORT
              valueFrom: { configMapKeyRef: { name: settings, key: REDIS_PORT } }
            - name: ACCESS_TOKEN_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: secrets, key: ACCESS_TOKEN_PUBLIC_KEY } }
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          # Until the load balancer has stopped sending to the pod.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: socket-server
spec:
  selector:
    app: socket-server
  ports:
    - name: http
      port: 3001
      targetPort: http
