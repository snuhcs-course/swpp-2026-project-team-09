# Phones reach it through the load balancer, whose addresses are in the public subnets (network.tf). It calls Redis only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: socket-server
spec:
  podSelector:
    matchLabels:
      app: socket-server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.0.0/20 }
        - ipBlock: { cidr: 10.0.16.0/20 }
      ports:
        - { protocol: TCP, port: 3001 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - { protocol: TCP, port: 6379 }
