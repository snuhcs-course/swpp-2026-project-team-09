# As on the Dev Server: no volume, and never evicting a record. Its image does not change with Releases.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:8
          args: ['redis-server', '--maxmemory-policy', 'noeviction']
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
