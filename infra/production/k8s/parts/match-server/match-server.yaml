# One match server at a time, so a Release stops the old pod before it starts the new one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: match-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: match-server
  template:
    metadata:
      labels:
        app: match-server
    spec:
      enableServiceLinks: false
      containers:
        - name: match-server
          image: match-server
          ports:
            - name: http
              containerPort: 3003
          env:
            - name: PORT
              value: '3003'
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: secrets, key: MATCH_DATABASE_URL } }
            - name: MAIN_SERVER_URL
              valueFrom: { configMapKeyRef: { name: settings, key: MAIN_SERVER_URL } }
            - name: MATCH_SERVER_TOKEN
              valueFrom: { secretKeyRef: { name: secrets, key: MATCH_SERVER_TOKEN } }
            - name: ROUND_INTERVAL_SECONDS
              valueFrom: { configMapKeyRef: { name: settings, key: ROUND_INTERVAL_SECONDS } }
          resources:
            requests:
              memory: 192Mi
            limits:
              memory: 384Mi
          # The first start migrates the database before it listens.
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: match-server
spec:
  selector:
    app: match-server
  ports:
    - name: http
      port: 3003
      targetPort: http
