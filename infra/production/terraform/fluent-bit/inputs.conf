# Per server: one input each, tagged with the server's name, which its filters (server-filters.conf) and its output
# (outputs.conf) match.

# The main server's own pods only: pods and container named main-server, in snunow. A file already there when Fluent
# Bit starts is read from its end, so a restart posts nothing twice; one that appears later, such as a Release's new
# pod's, is read from its first line.
[INPUT]
    Name              tail
    Tag               main-server
    Path              /var/log/containers/main-server-*_snunow_main-server-*.log
    multiline.parser  cri
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
