# Per server: a Slack output each, to the server's own channel, with the webhook from an environment variable. Each
# flush is one post with a line per record. A post that still fails after its retries is dropped; Fluent Bit ignores
# Slack's Retry-After.

# #team9-main-server-error
[OUTPUT]
    Name         slack
    Match        main-server
    Webhook      ${SLACK_WEBHOOK_MAIN_SERVER}
    Retry_Limit  3

# The worker server's channel
[OUTPUT]
    Name         slack
    Match        worker-server
    Webhook      ${SLACK_WEBHOOK_WORKER_SERVER}
    Retry_Limit  3

# The socket server's channel
[OUTPUT]
    Name         slack
    Match        socket-server
    Webhook      ${SLACK_WEBHOOK_SOCKET_SERVER}
    Retry_Limit  3
