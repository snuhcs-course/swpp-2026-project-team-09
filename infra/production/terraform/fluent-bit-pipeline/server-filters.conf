# Per server, after the shared filters (filters.conf): the server's name as the record's first field, and a throttle
# of its own, so that a noisy server cannot use up another's posts.

[FILTER]
    Name           modify
    Match          main-server
    Add            server main-server
    Move_to_start  server

# At most 10 records a minute: a record is dropped once the last 5 intervals of 12 seconds hold Rate x Window = 10.
# Fluent Bit replaces a Window of 1 with 5, so 10 a minute cannot be written as Rate 10 per 1-minute Window.
[FILTER]
    Name      throttle
    Match     main-server
    Rate      2
    Window    5
    Interval  12s

[FILTER]
    Name           modify
    Match          worker-server
    Add            server worker-server
    Move_to_start  server

[FILTER]
    Name      throttle
    Match     worker-server
    Rate      2
    Window    5
    Interval  12s

[FILTER]
    Name           modify
    Match          socket-server
    Add            server socket-server
    Move_to_start  server

[FILTER]
    Name      throttle
    Match     socket-server
    Rate      2
    Window    5
    Interval  12s
