# Shared by every server, and before each server's own filters (server-filters.conf), so that only warnings and
# errors reach a server's throttle.

# The JSON line's fields join the CRI parser's time, stream and _p. A line that is not JSON passes as it was, with no
# level, and the grep below drops it.
[FILTER]
    Name          parser
    Match         *
    Key_Name      log
    Parser        json
    Reserve_Data  On

[FILTER]
    Name   grep
    Match  *
    Regex  level ^(warn|error|fatal)$

[FILTER]
    Name           record_modifier
    Match          *
    Allowlist_key  level
    Allowlist_key  context
    Allowlist_key  message
    Allowlist_key  stack

# A Slack post prints the record in its own order: the class before what failed, and the long stack last.
[FILTER]
    Name         modify
    Match        *
    Move_to_end  message
    Move_to_end  stack
