# The fluent-bit chart's default [SERVICE] section, which Production keeps, with the chart's values filled in. It
# leaves out the chart's custom parsers file, which the pipeline does not use; the json parser comes from the image's
# parsers.conf.
[SERVICE]
    Daemon        Off
    Flush         1
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    Health_Check  On
